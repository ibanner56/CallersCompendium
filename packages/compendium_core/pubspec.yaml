name: compendium_core
description: >-
  Pure-Dart domain core for Caller's Compendium: domain model, figure
  taxonomy, dialect engine, and import parsers. No Flutter dependencies
  (see ADR-001).
version: 0.9.1
publish_to: none
repository: https://github.com/ibanner56/CallersCompendium
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  meta: ^1.19.0
  collection: ^1.19.1
  html: ^0.15.7
  drift: ^2.35.2
  sqlite3: ^3.7.0
  path: ^1.9.1
  unorm_dart: ^0.3.3
  crypto: ^3.0.7

dev_dependencies:
  analyzer: ^13.3.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  lints: ^6.1.0
  test: ^1.31.1
