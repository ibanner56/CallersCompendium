name: compendium_core
description: >-
  Pure-Dart domain core for Caller's Compendium: domain model, figure
  taxonomy, dialect engine, and import parsers. No Flutter dependencies
  (see ADR-001).
version: 0.3.0
publish_to: none
repository: https://github.com/ibanner56/CallersCompendium
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  meta: ^1.16.0
  collection: ^1.19.0
  html: ^0.15.6
  drift: ^2.34.2
  sqlite3: ^3.4.0
  path: ^1.9.1
  unorm_dart: ^0.3.2

dev_dependencies:
  analyzer: ^13.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  lints: ^6.0.0
  test: ^1.25.6
