# The workspace-root options (../../analysis_options.yaml) are layered on top
# so the strict analyzer settings (strict-casts / strict-inference /
# strict-raw-types and the error escalations defined there) actually apply to
# this package. The analyzer only reads the *nearest* options file, so without
# this explicit include the intended strictness would be silently unenforced.
#
# This mirrors compendium_core's arrangement deliberately: the two packages
# share a toolchain and a dance representation, so a lint that fires in one
# should fire in the other.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

include:
  - package:lints/recommended.yaml
  - ../../analysis_options.yaml