# Reference Apache 2.4 configuration for the supported Linux host-network
# deployment. Enable: ssl, headers, proxy, proxy_http, reqtimeout, and rewrite.

# This format intentionally excludes %r, which contains the request target and
# can therefore contain a device ID. It also excludes all request headers.
LogFormat "%h %l %u %t %>s %b" safe_no_request_target

<VirtualHost *:80>
    ServerName sync.example.invalid

    # ACME HTTP-01 may be served here. Device Sync is never redirected or
    # proxied from plaintext; requests to /v1 are refused by this vhost.
    <LocationMatch "^/v1(?:/|$)">
        Require all denied
    </LocationMatch>
    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory "/var/www/acme/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/athenaeum-http-error.log
    CustomLog ${APACHE_LOG_DIR}/athenaeum-http-access.log safe_no_request_target
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName sync.example.invalid

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/sync.example.invalid/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sync.example.invalid/privkey.pem
    Header always set Strict-Transport-Security "max-age=31536000"

    LimitRequestBody 16777216
    ProxyPreserveHost On
    ProxyPass /v1/ http://127.0.0.1:33333/v1/ connectiontimeout=5 timeout=60
    ProxyPassReverse /v1/ http://127.0.0.1:33333/v1/

    # mod_proxy forwards Authorization unchanged. Do not add a rewrite or
    # logging directive that copies credentials into an access/error log.
    RequestHeader set X-Forwarded-For expr=%{REMOTE_ADDR}
    <LocationMatch "^/v1(?:/|$)">
        Require all granted
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/athenaeum-https-error.log
    CustomLog ${APACHE_LOG_DIR}/athenaeum-https-access.log safe_no_request_target
</VirtualHost>
</IfModule>
