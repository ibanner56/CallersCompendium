<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="740" viewBox="0 0 1160 740" font-family="system-ui,Segoe UI,Roboto,sans-serif">
  <style>
    .frame{fill:#ffffff;stroke:#333;stroke-width:2}
    .panel{fill:#f5f5f5;stroke:#c4c4c4;stroke-width:1.5}
    .card{fill:#ffffff;stroke:#a8a8a8;stroke-width:1.5}
    .bar{fill:#d3d3d3}.barL{fill:#c0c0c0}.barD{fill:#9e9e9e}
    .ph{fill:none;stroke:#c0c0c0;stroke-width:1.5;stroke-dasharray:5 5}
    .icon{fill:#dcdcdc;stroke:#9a9a9a;stroke-width:1}
    .t{fill:#2b2b2b;font-weight:700;font-size:15px}
    .l{fill:#3a3a3a;font-weight:600;font-size:12px}
    .s{fill:#6a6a6a;font-size:11px}
    .an{fill:#ffffff;font-weight:700;font-size:11px}
    .anc{fill:#b04a2f}
    .note{fill:#3a3a3a;font-size:12px}
    .noteh{fill:#b04a2f;font-weight:700;font-size:12px}
    .focus{fill:none;stroke:#b04a2f;stroke-width:2}
  </style>
  <rect class="frame" x="1" y="1" width="1158" height="738" rx="10"/>
  <!-- title strip -->
  <text class="t" x="20" y="30">Collection — browse + search</text>
  <text class="s" x="20" y="48">ux.md §1 · desktop list/detail · low-fi</text>
  <line x1="0" y1="60" x2="820" y2="60" stroke="#e0e0e0"/>

  <!-- nav rail -->
  <rect class="panel" x="10" y="70" width="64" height="660" rx="8"/>
  <circle class="icon" cx="42" cy="104" r="14"/><rect class="barD" x="24" y="124" width="36" height="6" rx="3"/>
  <circle class="icon" cx="42" cy="164" r="14"/><rect class="bar" x="26" y="184" width="32" height="6" rx="3"/>
  <circle class="icon" cx="42" cy="224" r="14"/><rect class="bar" x="30" y="244" width="24" height="6" rx="3"/>
  <rect class="focus" x="20" y="86" width="44" height="46" rx="8"/>

  <!-- top bar: search + sort + actions -->
  <rect class="card" x="84" y="70" width="1066" height="44" rx="8"/>
  <circle class="icon" cx="108" cy="92" r="9"/>
  <rect class="bar" x="126" y="88" width="360" height="8" rx="4"/>
  <text class="s" x="126" y="108">search — unified full-text, dialect-canonicalized</text>
  <rect class="card" x="640" y="78" width="120" height="28" rx="14"/><text class="s" x="654" y="96">Sort ▾</text>
  <rect class="card" x="900" y="78" width="70" height="28" rx="6"/><text class="s" x="916" y="96">New</text>
  <rect class="card" x="978" y="78" width="80" height="28" rx="6"/><text class="s" x="992" y="96">Import</text>
  <rect class="card" x="1066" y="78" width="76" height="28" rx="6"/><text class="s" x="1078" y="96">Batch ▾</text>

  <!-- filter panel -->
  <rect class="panel" x="84" y="126" width="236" height="604" rx="8"/>
  <text class="l" x="100" y="150">Filters</text>
  <text class="s" x="100" y="168">friendly query builder</text>
  <g>
    <rect class="card" x="100" y="180" width="204" height="30" rx="6"/><text class="s" x="112" y="200">Formation ▾</text>
    <rect class="card" x="100" y="218" width="204" height="30" rx="6"/><text class="s" x="112" y="238">Progression ▾</text>
    <rect class="card" x="100" y="256" width="204" height="30" rx="6"/><text class="s" x="112" y="276">Author ▾</text>
    <rect class="card" x="100" y="294" width="204" height="30" rx="6"/><text class="s" x="112" y="314">Tags ▾</text>
    <rect class="card" x="100" y="332" width="204" height="58" rx="6"/><text class="s" x="112" y="352">Figure query</text><text class="s" x="112" y="372">"petronella in B1"</text>
  </g>
  <rect class="ph" x="100" y="402" width="204" height="30" rx="6"/><text class="s" x="130" y="422">+ advanced (tree) ▾</text>

  <!-- results list -->
  <rect class="panel" x="330" y="126" width="392" height="604" rx="8"/>
  <text class="s" x="346" y="150">128 dances</text>
  <g>
    <rect class="card" x="344" y="162" width="364" height="70" rx="8"/>
    <rect class="barD" x="360" y="178" width="180" height="9" rx="4"/>
    <rect class="bar" x="360" y="196" width="120" height="6" rx="3"/>
    <rect class="card" x="360" y="210" width="70" height="16" rx="8"/><circle class="icon" cx="372" cy="218" r="5"/><rect class="s" x="382" y="215" width="0" height="0"/><text class="s" x="382" y="222">Becket</text>
    <rect class="card" x="438" y="210" width="54" height="16" rx="8"/><circle class="icon" cx="450" cy="218" r="5"/><text class="s" x="460" y="222">jig</text>
    <rect class="card" x="500" y="210" width="60" height="16" rx="8"/><circle class="icon" cx="512" cy="218" r="5"/><text class="s" x="522" y="222">smooth</text>
  </g>
  <rect class="ph" x="344" y="242" width="364" height="474" rx="8"/>
  <text class="s" x="470" y="486">virtualized list…</text>

  <!-- detail preview -->
  <rect class="panel" x="732" y="126" width="418" height="604" rx="8"/>
  <text class="l" x="750" y="152">Detail preview</text>
  <rect class="barD" x="750" y="166" width="240" height="12" rx="6"/>
  <rect class="bar" x="750" y="188" width="180" height="7" rx="3"/>
  <rect class="ph" x="750" y="210" width="384" height="150" rx="8"/><text class="s" x="880" y="290">figure summary</text>
  <rect class="card" x="750" y="374" width="120" height="30" rx="6"/><text class="s" x="770" y="394">Open ▸</text>
  <rect class="card" x="882" y="374" width="150" height="30" rx="6"/><text class="s" x="900" y="394">Add to program</text>

  <!-- annotations -->
  <g>
    <circle class="anc" cx="118" cy="92" r="10"/><text class="an" x="114" y="96">1</text>
    <circle class="anc" cx="96" cy="150" r="10"/><text class="an" x="92" y="154">2</text>
    <circle class="anc" cx="346" cy="140" r="10"/><text class="an" x="342" y="144">3</text>
    <circle class="anc" cx="404" cy="218" r="10"/><text class="an" x="400" y="222">4</text>
    <circle class="anc" cx="716" cy="150" r="10"/><text class="an" x="712" y="154">5</text>
    <circle class="anc" cx="908" cy="92" r="10"/><text class="an" x="904" y="96">6</text>
    <circle class="anc" cx="42" cy="712" r="10"/><text class="an" x="38" y="716">7</text>
  </g>
  <!-- annotation legend -->
  <g transform="translate(0,0)">
    <text class="noteh" x="470" y="516">Notes</text>
    <text class="note" x="470" y="536">1 · Unified FTS; input dialect-canonicalized before query.</text>
    <text class="note" x="470" y="556">2 · Query builder: common cases one-tap, advanced tree behind "advanced".</text>
    <text class="note" x="470" y="576">3 · Virtualized; sort by title / author / recently-added / last-called.</text>
    <text class="note" x="470" y="596">4 · Formation &amp; tag chips = icon + text (never color-only).</text>
    <text class="note" x="470" y="616">5 · Result count announced politely to AT (live region).</text>
    <text class="note" x="470" y="636">6 · Actions: new · import · duplicate · batch tag.</text>
    <text class="note" x="470" y="656">7 · Desktop = list + detail split; phone collapses to single pane</text>
    <text class="note" x="486" y="674">with bottom nav (Collection · Programs · Settings).</text>
  </g>
</svg>
