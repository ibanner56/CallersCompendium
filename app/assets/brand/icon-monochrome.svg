<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- Single flat-color glyph on transparent, for Android 13+ themed icons and
       maskable PWA use. Same 0.80 scale as the foreground, so the glyph stays
       inside the central themed/maskable safe zone. The consumer supplies the
       ink color (Android tints the layer; use currentColor in-app). -->
  <g transform="translate(54 54) scale(0.8) translate(-64 -64)" fill="currentColor">
    <rect x="38" y="44" width="18" height="56" rx="9"/>
    <rect x="72" y="28" width="18" height="56" rx="9"/>
  </g>
</svg>
