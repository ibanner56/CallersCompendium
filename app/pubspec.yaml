name: compendium_app
description: "Caller's Compendium — an open-source, local-first dance organizer for callers."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  compendium_core:
    path: ../packages/compendium_core
  cupertino_icons: ^1.0.8
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.5
  pdf: ^3.11.1
  printing: ^5.13.3
  screen_retriever: ^0.2.0
  share_plus: ^13.2.1
  url_launcher: ^6.3.1
  wakelock_plus: ^1.6.1
  window_manager: ^0.5.2
  file_selector: ^1.1.0
  http: ^1.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2
  wakelock_plus_platform_interface: ^1.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-VariableFont.ttf
    # Bundled font license texts, loaded at runtime via LicenseRegistry so
    # they appear in showLicensePage (Settings ▸ About ▸ View licenses).
    - assets/fonts/Fraunces-OFL.txt
    - assets/fonts/AtkinsonHyperlegible-OFL.txt
    - assets/fonts/Roboto-OFL.txt
  fonts:
    - family: Fraunces # display / headings (serif, OFL) — variable opsz/wght
      fonts:
        - asset: assets/fonts/Fraunces-VariableFont.ttf
    - family: AtkinsonHyperlegible # body / UI / Perform (OFL, low-vision)
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
    - family: Roboto # fallback
      fonts:
        - asset: assets/fonts/Roboto-VariableFont.ttf
