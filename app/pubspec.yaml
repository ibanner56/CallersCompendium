name: compendium_app
description: "Caller's Compendium — an open-source, local-first dance organizer for callers."
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  compendium_core:
    path: ../packages/compendium_core
  cupertino_icons: ^1.0.8
  drift: ^2.34.1
  drift_flutter: ^0.3.0
  path_provider: ^2.1.5
  pdf: ^3.11.1
  printing: ^5.13.3
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-VariableFont.ttf
