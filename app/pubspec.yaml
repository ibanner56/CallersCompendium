name: compendium_app
description: "Caller's Compendium — an open-source, local-first dance organizer for callers."
publish_to: none
version: 0.3.0
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # Flutter's bundled localizations + delegates (Material/Cupertino/Widgets) and
  # the i18n framework. Declared directly (not just transitively) because the
  # gen-l10n output imports `package:intl` and its setup instructions require it;
  # `any` lets `flutter pub get` select the version the Flutter SDK pins.
  flutter_localizations:
    sdk: flutter
  intl: any
  compendium_core:
    path: ../packages/compendium_core
  cupertino_icons: ^1.0.8
  # Assisted-download (A11b): sha256 integrity verification of a downloaded
  # update artifact against the manifest's `sha256` (ADR-002 §2/§6, "Stage 1.5").
  # Already resolved transitively; promoted to a direct dependency because
  # verification genuinely needs it — a mismatch is a hard security gate, not a
  # no-op. Pinned to the version already in the root lock, so the resolve is a
  # `--enforce-lockfile` no-op.
  crypto: ^3.0.6
  # Sole remaining use: Ed25519 detached-signature verification for the update
  # manifest trust anchor (issue #431, ADR-002 §6). See
  # src/update/update_signature.dart. Pure-Dart (works on every target and in
  # tests) so it needs no native plugin. The passphrase-encrypted backup
  # export this was originally added for (issue #461) was removed in #536.
  cryptography: ^2.9.0
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  path: ^1.9.0
  path_provider: ^2.1.5
  sqlite3: ^3.4.0
  pdf: ^3.11.1
  printing: ^5.13.3
  screen_retriever: ^0.2.0
  share_plus: ^13.2.1
  url_launcher: ^6.3.1
  wakelock_plus: ^1.6.1
  window_manager: ^0.5.2
  file_selector: ^1.1.0
  http: ^1.2.2
  # In-app User Guide: render the bundled Markdown guides (headings, lists,
  # tables, fenced code, links). `flutter_markdown_plus` is the maintained
  # successor to the discontinued `flutter_markdown` and exposes the
  # `onTapLink`/`imageBuilder` seams the guide's in-app navigation relies on.
  flutter_markdown_plus: ^1.0.12
  # `flutter_markdown_plus` builds on the `markdown` package and exposes its AST
  # in the `MarkdownElementBuilder` API. The guide implements one of those
  # builders (to tag headings with anchors so `#fragment` links can scroll to
  # them), so it needs `md.Element` directly rather than transitively.
  markdown: ^7.3.1
  # Swipe-to-reveal row actions (issue #352): the dance/programs lists swipe left
  # to reveal a Delete button (tapping it is the confirmation), replacing the
  # old swipe-to-dismiss. Flutter's Dismissible deletes on drag and can't reveal
  # a persistent action, so we use flutter_slidable's Slidable/SlidableAction.
  flutter_slidable: ^4.0.3
  # Brand mark / app icon (issue: new "dancers rising from a book" illustration).
  # The in-app mark (nav rail, empty states, About) renders the committed brand
  # SVGs in app/assets/brand/ so it stays pixel-identical to the launcher icons.
  # The illustration is multi-path vector art, so — unlike the previous
  # geometry-only mark — it needs an SVG runtime rather than a bespoke painter.
  flutter_svg: ^2.0.17
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2
  wakelock_plus_platform_interface: ^1.5.1

flutter:
  uses-material-design: true
  # Enable gen-l10n: `flutter pub get` / `flutter gen-l10n` reads app/l10n.yaml
  # and generates the AppLocalizations sources into lib/l10n/ (checked in).
  generate: true
  assets:
    - assets/fonts/Roboto-VariableFont.ttf
    # Static Roboto instances (same family/license as the variable font
    # above) used *only* for PDF export: the `pdf` package cannot resolve
    # variable-font axes, so it always renders a variable font's default
    # master regardless of requested weight/style (see program_pdf.dart).
    # These are pinned-axis instances of the exact same upstream Roboto,
    # generated with `fonttools varLib.instancer`; on-screen text keeps
    # using the variable font above via the Flutter `fonts:` family below.
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/Roboto-Italic.ttf
    # Static, hand-subsetted (`fonttools subset`) instance of Google's Noto
    # Sans Symbols 2 (OFL), trimmed to just the three glyphs (★ ▸ ✓) the
    # bundled Roboto lacks. Used only as a `pw.TextStyle.fontFallback` on the
    # program-matrix PDF's marker/legend cells (see program_matrix_pdf.dart,
    # #633) — not a variable font, and not registered as a Flutter `fonts:`
    # family since it's loaded directly via `pw.Font.ttf` for PDF export only.
    - assets/fonts/ProgramMatrixMarkers-Regular.ttf
    # Bundled font license texts, loaded at runtime via LicenseRegistry so
    # they appear in showLicensePage (Settings ▸ About ▸ View licenses).
    - assets/fonts/Fraunces-OFL.txt
    - assets/fonts/AtkinsonHyperlegible-OFL.txt
    - assets/fonts/Roboto-OFL.txt
    - assets/fonts/NotoSansSymbols2-OFL.txt
    # In-app User Guide: the offline copy of the user documentation, mirrored
    # from /docs/user by tools/ci/sync_user_docs.py and kept in sync by a CI
    # drift-check. Rendered from these bundled assets so the guide works fully
    # offline. Text-only for now — images are rendered as alt-text captions.
    - assets/docs/user/
    # First-run seed: the bundled, offline-generated Compendium archive for
    # "The Baby Rose" by David Kaynor, inserted once on a fresh/empty first
    # launch so the collection is never empty (see src/data/seed_service.dart;
    # generated by packages/compendium_core/test/seed/).
    - assets/seed/baby_rose.json
    # Brand mark / app-icon source SVGs (app/assets/brand/). Rendered in-app by
    # BrandMark (nav rail, empty states, About) via flutter_svg so the in-app
    # mark matches the generated launcher icons. Also the source of truth for
    # tools/brand/generate_icons.py.
    - assets/brand/
  fonts:
    - family: Fraunces # display / headings (serif, OFL) — variable opsz/wght
      fonts:
        - asset: assets/fonts/Fraunces-VariableFont.ttf
    - family: AtkinsonHyperlegible # body / UI / Perform (OFL, low-vision)
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
    - family: Roboto # fallback
      fonts:
        - asset: assets/fonts/Roboto-VariableFont.ttf
