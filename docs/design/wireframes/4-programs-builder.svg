<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="740" viewBox="0 0 1160 740" font-family="system-ui,Segoe UI,Roboto,sans-serif">
  <style>
    .frame{fill:#ffffff;stroke:#333;stroke-width:2}
    .panel{fill:#f5f5f5;stroke:#c4c4c4;stroke-width:1.5}
    .card{fill:#ffffff;stroke:#a8a8a8;stroke-width:1.5}
    .bar{fill:#d3d3d3}.barD{fill:#9e9e9e}
    .ph{fill:none;stroke:#c0c0c0;stroke-width:1.5;stroke-dasharray:5 5}
    .icon{fill:#dcdcdc;stroke:#9a9a9a;stroke-width:1}
    .t{fill:#2b2b2b;font-weight:700;font-size:15px}
    .l{fill:#3a3a3a;font-weight:600;font-size:12px}
    .s{fill:#6a6a6a;font-size:11px}
    .an{fill:#ffffff;font-weight:700;font-size:11px}.anc{fill:#b04a2f}
    .note{fill:#3a3a3a;font-size:12px}.noteh{fill:#b04a2f;font-weight:700;font-size:12px}
    .alt{fill:#efefef;stroke:#9a9a9a;stroke-width:1.5;stroke-dasharray:4 3}
    .tab{fill:#ffffff;stroke:#a8a8a8;stroke-width:1.5}
    .tabon{fill:#b04a2f}
  </style>
  <rect class="frame" x="1" y="1" width="1158" height="738" rx="10"/>
  <text class="t" x="20" y="30">Programs — builder (List view)</text>
  <text class="s" x="20" y="48">ux.md §4 · low-fi · Matrix view: see 5-program-matrix.svg</text>
  <line x1="0" y1="60" x2="900" y2="60" stroke="#e0e0e0"/>

  <!-- header: event meta + actions -->
  <rect class="card" x="20" y="70" width="1120" height="58" rx="8"/>
  <rect class="barD" x="40" y="88" width="220" height="12" rx="6"/>
  <text class="s" x="40" y="118">date · venue · notes</text>
  <rect class="card" x="300" y="84" width="150" height="28" rx="6"/><text class="s" x="316" y="102">📅 date / venue</text>
  <rect class="card" x="760" y="84" width="96" height="28" rx="6"/><text class="s" x="774" y="102">Duplicate</text>
  <rect class="card" x="864" y="84" width="110" height="28" rx="6"/><text class="s" x="878" y="102">Export ▾</text>
  <rect class="card" x="982" y="84" width="140" height="28" rx="14"/><circle class="icon" cx="1000" cy="98" r="8"/><text class="s" x="1014" y="102">Mark performed</text>

  <!-- view tabs -->
  <rect class="tabon" x="20" y="138" width="90" height="30" rx="6"/><text class="an" x="42" y="158">List</text>
  <rect class="tab" x="116" y="138" width="90" height="30" rx="6"/><text class="s" x="140" y="158">Matrix</text>

  <!-- left: program ordered slots -->
  <rect class="panel" x="20" y="176" width="560" height="540" rx="8"/>
  <text class="l" x="40" y="200">Program — ordered slots</text>
  <g>
    <rect class="card" x="40" y="212" width="520" height="40" rx="8"/>
    <rect class="card" x="50" y="220" width="18" height="24" rx="4"/><text class="s" x="54" y="236">⋮⋮</text>
    <text class="s" x="78" y="236">1</text><rect class="bar" x="98" y="228" width="220" height="8" rx="4"/>
    <text class="s" x="440" y="236">reel · 32</text>
    <rect class="card" x="500" y="220" width="24" height="24" rx="4"/><text class="s" x="507" y="236">✎</text>
    <rect class="card" x="528" y="220" width="24" height="24" rx="4"/><text class="s" x="535" y="236">✕</text>
  </g>
  <!-- alt under primary -->
  <rect class="alt" x="72" y="258" width="488" height="34" rx="8"/>
  <rect class="card" x="82" y="264" width="52" height="20" rx="10"/><circle class="icon" cx="96" cy="274" r="6"/><text class="s" x="108" y="278">ALT</text>
  <rect class="bar" x="146" y="270" width="180" height="8" rx="4"/><text class="s" x="440" y="278">jig · 32</text>

  <rect class="card" x="40" y="300" width="520" height="40" rx="8"/>
  <rect class="card" x="50" y="308" width="18" height="24" rx="4"/><text class="s" x="54" y="324">⋮⋮</text>
  <text class="s" x="78" y="324">2</text><rect class="bar" x="98" y="316" width="180" height="8" rx="4"/><text class="s" x="440" y="324">jig · 48</text>

  <!-- free-text slot -->
  <rect class="card" x="40" y="348" width="520" height="34" rx="8"/>
  <circle class="icon" cx="60" cy="365" r="7"/><text class="s" x="78" y="369">free-text slot — break / waltz / announcements</text>

  <rect class="ph" x="40" y="392" width="520" height="308" rx="8"/><text class="s" x="270" y="550">more slots… (reorder: drag + ▲▼)</text>

  <!-- right: collection picker (same filter panel) -->
  <rect class="panel" x="596" y="176" width="544" height="540" rx="8"/>
  <text class="l" x="616" y="200">Collection picker — same filter panel as §1</text>
  <rect class="card" x="616" y="212" width="360" height="30" rx="8"/><circle class="icon" cx="634" cy="227" r="8"/><text class="s" x="652" y="231">search / filter</text>
  <rect class="card" x="988" y="212" width="132" height="30" rx="6"/><text class="s" x="1004" y="231">Filters ▾</text>
  <g>
    <rect class="card" x="616" y="252" width="504" height="44" rx="8"/><rect class="barD" x="632" y="266" width="180" height="9" rx="4"/><rect class="bar" x="632" y="282" width="120" height="6" rx="3"/>
    <rect class="card" x="1060" y="262" width="48" height="24" rx="6"/><text class="s" x="1072" y="279">+ Add</text>
  </g>
  <rect class="ph" x="616" y="304" width="504" height="396" rx="8"/><text class="s" x="820" y="504">virtualized results → drag or "+ Add" into program</text>

  <!-- annotations -->
  <circle class="anc" cx="40" cy="200" r="10"/><text class="an" x="36" y="204">1</text>
  <circle class="anc" cx="92" cy="274" r="10"/><text class="an" x="88" y="278">2</text>
  <circle class="anc" cx="50" cy="365" r="10"/><text class="an" x="46" y="369">3</text>
  <circle class="anc" cx="616" cy="200" r="10"/><text class="an" x="612" y="204">4</text>
  <circle class="anc" cx="162" cy="153" r="10"/><text class="an" x="158" y="157">5</text>
  <circle class="anc" cx="1000" cy="98" r="10"/><text class="an" x="996" y="102">6</text>

  <text class="noteh" x="596" y="620">Notes</text>
  <text class="note" x="596" y="640">1 · Ordered slots; reorder via drag + non-drag ▲▼ (WCAG 2.5.7); inline slot notes.</text>
  <text class="note" x="596" y="660">2 · ALT flag = indented alternate under its primary — icon + text, never color alone.</text>
  <text class="note" x="596" y="680">3 · Dance slots + free-text slots (break / waltz / announcements).</text>
  <text class="note" x="596" y="700">4 · Picker reuses Collection filter panel.  5 · Matrix tab.  6 · Mark performed → calling history.</text>
</svg>
