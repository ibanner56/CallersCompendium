<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="740" viewBox="0 0 1160 740" font-family="system-ui,Segoe UI,Roboto,sans-serif">
  <style>
    .frame{fill:#ffffff;stroke:#333;stroke-width:2}
    .panel{fill:#f5f5f5;stroke:#c4c4c4;stroke-width:1.5}
    .card{fill:#ffffff;stroke:#a8a8a8;stroke-width:1.5}
    .bar{fill:#d3d3d3}.barD{fill:#9e9e9e}
    .ph{fill:none;stroke:#c0c0c0;stroke-width:1.5;stroke-dasharray:5 5}
    .icon{fill:#dcdcdc;stroke:#9a9a9a;stroke-width:1}
    .t{fill:#2b2b2b;font-weight:700;font-size:15px}
    .l{fill:#3a3a3a;font-weight:600;font-size:12px}
    .s{fill:#6a6a6a;font-size:11px}
    .an{fill:#ffffff;font-weight:700;font-size:11px}.anc{fill:#b04a2f}
    .note{fill:#3a3a3a;font-size:12px}.noteh{fill:#b04a2f;font-weight:700;font-size:12px}
    .warn{fill:#fbeee9;stroke:#b04a2f;stroke-width:1.5}
  </style>
  <rect class="frame" x="1" y="1" width="1158" height="738" rx="10"/>
  <text class="t" x="20" y="30">Dance detail / card</text>
  <text class="s" x="20" y="48">ux.md §2 · low-fi</text>
  <line x1="0" y1="60" x2="820" y2="60" stroke="#e0e0e0"/>

  <!-- rail -->
  <rect class="panel" x="10" y="70" width="64" height="660" rx="8"/>
  <circle class="icon" cx="42" cy="104" r="14"/><circle class="icon" cx="42" cy="164" r="14"/><circle class="icon" cx="42" cy="224" r="14"/>

  <!-- header card -->
  <rect class="card" x="84" y="70" width="760" height="120" rx="8"/>
  <rect class="barD" x="104" y="96" width="300" height="14" rx="7"/>
  <rect class="bar" x="104" y="120" width="200" height="7" rx="3"/>
  <rect class="card" x="104" y="136" width="88" height="18" rx="9"/><circle class="icon" cx="118" cy="145" r="6"/><text class="s" x="130" y="149">Becket</text>
  <rect class="card" x="200" y="136" width="70" height="18" rx="9"/><circle class="icon" cx="214" cy="145" r="6"/><text class="s" x="226" y="149">tag</text>
  <rect class="warn" x="104" y="160" width="260" height="22" rx="6"/><circle class="icon" cx="120" cy="171" r="7"/><text class="s" x="134" y="175">status banner — deprecated / broken</text>
  <text class="s" x="470" y="150">provenance — via The Caller's Box · CC-BY-NC</text>

  <!-- actions row -->
  <rect class="card" x="84" y="198" width="760" height="40" rx="8"/>
  <rect class="card" x="98" y="206" width="70" height="24" rx="6"/><text class="s" x="112" y="222">Edit</text>
  <rect class="card" x="176" y="206" width="90" height="24" rx="6"/><text class="s" x="190" y="222">Duplicate</text>
  <rect class="card" x="274" y="206" width="120" height="24" rx="6"/><text class="s" x="286" y="222">Add to program</text>
  <rect class="card" x="402" y="206" width="90" height="24" rx="6"/><text class="s" x="416" y="222">Print</text>
  <rect class="card" x="700" y="204" width="128" height="28" rx="14"/><circle class="icon" cx="718" cy="218" r="8"/><text class="s" x="732" y="222">Perform ▸</text>

  <!-- figure table -->
  <rect class="panel" x="84" y="246" width="760" height="470" rx="8"/>
  <text class="l" x="104" y="272">Figures — grouped by derived section</text>
  <rect class="card" x="600" y="256" width="228" height="28" rx="14"/><text class="s" x="614" y="274">canonical ⇄ dialect view</text>
  <!-- section A1 -->
  <text class="l" x="104" y="300">A1</text><line x1="130" y1="296" x2="824" y2="296" stroke="#ddd"/>
  <g>
    <rect class="bar" x="104" y="312" width="300" height="8" rx="4"/><text class="s" x="770" y="320">8</text>
    <rect class="bar" x="104" y="332" width="360" height="8" rx="4"/><text class="s" x="770" y="340">8</text>
  </g>
  <text class="l" x="104" y="366">A2</text><line x1="130" y1="362" x2="824" y2="362" stroke="#ddd"/>
  <rect class="bar" x="104" y="378" width="280" height="8" rx="4"/><text class="s" x="770" y="386">16</text>
  <text class="l" x="104" y="412">B1  ¶</text><line x1="150" y1="408" x2="824" y2="408" stroke="#ddd"/>
  <rect class="bar" x="104" y="424" width="330" height="8" rx="4"/><text class="s" x="770" y="432">8</text>
  <text class="s" x="700" y="272">beats →</text>
  <rect class="ph" x="104" y="452" width="724" height="248" rx="8"/><text class="s" x="440" y="580">B2 … (scrolls)</text>

  <!-- side tabs -->
  <rect class="panel" x="856" y="70" width="294" height="646" rx="8"/>
  <rect class="card" x="868" y="82" width="66" height="26" rx="6"/><text class="s" x="878" y="99">Notes</text>
  <rect class="card" x="940" y="82" width="60" height="26" rx="6"/><text class="s" x="950" y="99">Links</text>
  <rect class="card" x="1006" y="82" width="72" height="26" rx="6"/><text class="s" x="1014" y="99">History</text>
  <rect class="card" x="1084" y="82" width="54" height="26" rx="6"/><text class="s" x="1092" y="99">Fields</text>
  <rect class="ph" x="868" y="120" width="270" height="580" rx="8"/>
  <text class="s" x="900" y="220">calling notes · source /</text>
  <text class="s" x="900" y="240">video / related links ·</text>
  <text class="s" x="900" y="260">calling history from</text>
  <text class="s" x="900" y="280">performed programs ·</text>
  <text class="s" x="900" y="300">custom fields</text>

  <!-- annotations -->
  <circle class="anc" cx="100" cy="90" r="10"/><text class="an" x="96" y="94">1</text>
  <circle class="anc" cx="100" cy="171" r="10"/><text class="an" x="96" y="175">2</text>
  <circle class="anc" cx="466" cy="150" r="10"/><text class="an" x="462" y="154">3</text>
  <circle class="anc" cx="614" cy="270" r="10"/><text class="an" x="610" y="274">4</text>
  <circle class="anc" cx="716" cy="218" r="10"/><text class="an" x="712" y="222">5</text>
  <circle class="anc" cx="868" cy="95" r="10"/><text class="an" x="864" y="99">6</text>

  <text class="noteh" x="440" y="612">Notes</text>
  <text class="note" x="440" y="632">1 · Header: title · authors · formation · hook · tags.</text>
  <text class="note" x="440" y="652">2 · Status banner is icon + text (deprecated / broken), not color-only.</text>
  <text class="note" x="440" y="672">3 · Provenance line for attribution/licence.  4 · Canonical⇄dialect toggle.</text>
  <text class="note" x="440" y="692">5 · Perform this dance.  6 · Side tabs: notes / links / history / fields.</text>
</svg>
