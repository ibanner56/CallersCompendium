# Dependabot configuration (schema v2).
# Keeps dependencies current across the pub workspace, GitHub Actions, and the
# Android Gradle build. Minor/patch bumps are grouped to reduce PR noise, while
# major bumps stay as individual PRs so breaking changes get their own review.
version: 2
updates:
  # Dart/Flutter (pub) dependencies. This repo is a pub workspace, so cover the
  # root along with each member package's pubspec.yaml.
  - package-ecosystem: "pub"
    directories:
      - "/"
      - "/app"
      - "/packages/compendium_core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      pub-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the CI workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
        # claude-code-action gets a PR of its own: it is pinned in
        # claude-code-review.yml, and a PR changing that file may change
        # nothing else but the same pin in claude.yml
        # (tools/ci/check_claude_workflow_isolation.py).
        exclude-patterns:
          - "anthropics/claude-code-action"

  # Android Gradle dependencies for the Flutter app.
  - package-ecosystem: "gradle"
    directory: "/app/android"
    schedule:
      interval: "weekly"
    groups:
      gradle-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
