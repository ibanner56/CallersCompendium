name: ✨ Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["type: enhancement", "status: triage"]
body:
  - type: markdown
    attributes:
      value: >-
        **Privacy:** Caller's Compendium is local-first and collects no
        telemetry. Please don't include personal or identifying information in
        your request.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the calling/organizing workflow this helps with.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of the app does this touch?
      description: Pick the closest area (a triager will confirm the matching area label).
      options:
        - "Collection (area: collection)"
        - "Dance entry (area: dance_entry)"
        - "Programs (area: programs)"
        - "Perform (area: perform)"
        - "Dialect (area: dialect)"
        - "Taxonomy (area: taxonomy)"
        - "Import (area: import)"
        - "Search (area: search)"
        - "Settings (area: settings)"
        - "Packaging (area: packaging)"
        - "Accessibility (area: a11y)"
        - "Docs (area: docs)"
        - "Not sure (triage will route it)"
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Constraints or alternatives (optional)
      description: Share these only if you considered a different approach.
    validations:
      required: false
  - type: textarea
    id: related-work
    attributes:
      label: Related issue, roadmap item, or discussion (optional)
      description: Link anything relevant if you already know it; triage will check for duplicates and planned work.
    validations:
      required: false
