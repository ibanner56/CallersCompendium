name: 📋 Beta check-in
description: A periodic, structured check-in for beta testers — how the app held up for you this period.
title: "[Beta check-in]: "
labels: ["beta", "type: feedback", "status: triage"]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for testing Caller's Compendium! These periodic check-ins are how
        we understand what real callers are using and where the rough edges are.
        Fill in what's relevant — skip anything that doesn't apply.


        New here and just want to join the program? Use the **Join the beta**
        form instead — this one is for reporting how a build held up once you're
        already testing.
  - type: markdown
    attributes:
      value: >-
        **Privacy:** the app is local-first and collects no telemetry. There's
        no automatic data collection — this check-in is entirely what you choose
        to share. Please don't include personal or identifying information.
  - type: input
    id: app-version
    attributes:
      label: App version
      description: "Find it in Settings ▸ About once that screen is available; otherwise it's 0.1.3."
      value: "0.1.3"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform(s) used this period
      multiple: true
      options:
        - Linux
        - macOS
        - Windows
        - Android
        - iOS / iPadOS
    validations:
      required: true
  - type: checkboxes
    id: areas-used
    attributes:
      label: What did you use this period?
      description: Check everything you touched, even briefly.
      options:
        - label: Collection / search
        - label: Programs / matrix
        - label: Perform mode
        - label: Dialects
        - label: Imports
        - label: Backup / restore
        - label: Settings
  - type: dropdown
    id: called-real-dance
    attributes:
      label: Did you call a real dance from Perform mode?
      description: This is the big one — did the app go to a gig with you?
      options:
        - "Yes — called a real dance from Perform mode"
        - "No — not this period"
    validations:
      required: true
  - type: textarea
    id: called-real-dance-notes
    attributes:
      label: Calling notes (optional)
      description: If you called (or tried to), how did Perform mode hold up? If not, what held you back?
    validations:
      required: false
  - type: textarea
    id: worked-well
    attributes:
      label: What worked well?
    validations:
      required: false
  - type: textarea
    id: friction
    attributes:
      label: What got in your way? (friction)
      description: Anything that was confusing, slow, awkward, or made you reach for a workaround.
    validations:
      required: false
  - type: textarea
    id: data-loss-or-crash
    attributes:
      label: Any data loss or crashes?
      description: >-
        Describe what happened and the impact. Anything involving lost dances,
        programs, or an inability to call at a gig is treated as critical — a
        separate bug report with reproduction steps is very welcome too.
    validations:
      required: false
  - type: dropdown
    id: confidence
    attributes:
      label: Overall confidence / would you recommend it?
      description: How ready does it feel for a fellow caller right now?
      options:
        - "Very — I'd recommend it to another caller today"
        - "Mostly — usable, with some caveats"
        - "Mixed — promising but not there yet"
        - "Not yet — too rough to recommend"
    validations:
      required: false
  - type: checkboxes
    id: privacy-ack
    attributes:
      label: Privacy acknowledgement
      options:
        - label: I haven't included personal or identifying information in this check-in.
          required: true
