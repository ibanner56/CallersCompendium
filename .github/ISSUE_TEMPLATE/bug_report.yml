name: 🐞 Bug report
description: Something isn't working correctly
title: "[Bug]: "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: >-
        **Privacy:** Caller's Compendium is local-first and collects no
        telemetry — there's no automatic diagnostics collection, so everything
        below is only what you provide. Please don't paste personal or
        identifying information.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug — what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform(s)
      description: Where you saw the bug (select all that apply).
      multiple: true
      options:
        - Linux
        - macOS
        - Windows
        - Android
        - iOS / iPadOS
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: "Find it in Settings ▸ About once that screen is available; otherwise it's 0.2.0."
      value: "0.2.0"
    validations:
      required: true
  - type: textarea
    id: dance-data
    attributes:
      label: Dance data involved (if notation-related)
      description: >-
        If the bug involves a specific dance, include its source (book, site,
        Caller's Box ID) or paste the figures so we can reproduce it. Please
        redact anything personal or private.
    validations:
      required: false
  - type: checkboxes
    id: privacy-ack
    attributes:
      label: Privacy acknowledgement
      options:
        - label: I haven't included personal or identifying information in this report.
          required: true
