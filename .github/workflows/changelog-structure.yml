# Structural gate for release-managed CHANGELOG history and pending fragments.
#
# app/CHANGELOG.md and packages/compendium_core/CHANGELOG.md are compiled at
# release time from changelog.d/*.json. Only the app CHANGELOG
# renders into published release notes; the core CHANGELOG is the core package's
# version record. Two structural mistakes render as valid Markdown and are
# therefore invisible to a preview and to every other gate: a category repeated
# inside one version section (the second list hides below the first), and a
# version section out of order (the notes generator finds a section anywhere in
# the file). See tools/ci/check_changelog_structure.py for the incidents behind
# each.
#
# It lives in its own workflow — rather than the shared _checks.yml — for the
# same reason docs-bundle-check.yml does: ci.yml skips _checks.yml for
# Markdown-only changes, and release.yml runs after the tag. Both changelogs
# are Markdown, and the PR that edits nothing else is exactly the release-prep
# PR this gate exists to check. A gate that only ran inside ci.yml would miss it.
#
# It is intentionally cheap (plain python3, no Flutter setup) and is not marked
# a required status, so it never runs on unrelated PRs and never leaves a
# required check pending.
name: Changelog validation

on:
  push:
    branches: [main]
    paths:
      - 'app/CHANGELOG.md'
      - 'packages/compendium_core/CHANGELOG.md'
      - 'changelog.d/**'
      - 'tools/release/compile_changelog_fragments.py'
      - 'tools/release/test_compile_changelog_fragments.py'
      - 'tools/ci/check_changelog_structure.py'
      - 'tools/ci/test_check_changelog_structure.py'
      - '.github/workflows/changelog-structure.yml'
  pull_request:
    paths:
      - 'app/CHANGELOG.md'
      - 'packages/compendium_core/CHANGELOG.md'
      - 'changelog.d/**'
      - 'tools/release/compile_changelog_fragments.py'
      - 'tools/release/test_compile_changelog_fragments.py'
      - 'tools/ci/check_changelog_structure.py'
      - 'tools/ci/test_check_changelog_structure.py'
      - '.github/workflows/changelog-structure.yml'

# Least privilege: this check only reads the checked-out code.
permissions:
  contents: read

jobs:
  changelog-structure:
    name: CHANGELOG validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This workflow is the focused validation gate for changelog tooling and
      # fragment-only PRs, which ci.yml may otherwise skip.
      - name: Test the changelog structure gate
        run: python3 tools/ci/test_check_changelog_structure.py
      - name: Test the changelog fragment compiler
        run: python3 tools/release/test_compile_changelog_fragments.py
      - name: Validate pending changelog fragments
        run: python3 tools/release/compile_changelog_fragments.py --check
      - name: Guard CHANGELOG structure (version order, no repeated category)
        run: python3 tools/ci/check_changelog_structure.py
