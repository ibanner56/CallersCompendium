# Release: on a `v*` tag, gate on the reusable checks, build UNSIGNED desktop
# binaries, package them under the ADR-002 deterministic name contract, and
# create a **DRAFT** GitHub Release (a human publishes). Everything here is FREE
# and needs NO secrets and NO code-signing (signing is a deliberately deferred
# later wave — see docs/adr/002-distribution-and-update-channels.md).
#
# SAFETY MODEL (A6):
#   * Global token is read-only (`permissions: contents: read`); ONLY the
#     `publish` job elevates to `contents: write`.
#   * Every job is guarded to the canonical repo on a tag ref (or a manual
#     dispatch), so forks / PRs can never trigger a release or mint an elevated
#     token.
#   * `publish` runs only for a real tag push. A manual `workflow_dispatch` run
#     therefore always builds + packages and uploads the results as workflow
#     artifacts WITHOUT creating any release (a build-only dry run).
#
# The Flutter version is derived from .fvmrc (single source of truth) via
# subosito/flutter-action, exactly like ci.yml / _checks.yml.
name: Release

on:
  push:
    tags: ['v*']
  # Manual, build-only dry run: builds + packages on all three OSes and uploads
  # the artifacts to the run, but never creates a release (the publish job is
  # gated to tag pushes). To actually cut a release, push a `v*` tag.
  workflow_dispatch: {}

# Don't cancel an in-flight release (a half-uploaded draft is worse than a
# queued run); serialize per ref instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: the default token only reads. The publish job opts into the
# narrower-still write scopes it needs (see its `permissions:` block).
permissions:
  contents: read

# bash everywhere (Git Bash on Windows) so the shared scripting is uniform;
# Windows-only packaging steps opt into PowerShell explicitly.
defaults:
  run:
    shell: bash

jobs:
  # Resolve + validate the release identity once, and expose it to every
  # downstream job. Fails fast if the tag doesn't match the built version.
  meta:
    name: Resolve release metadata
    if: >-
      github.repository == 'ibanner56/CallersCompendium' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      channel: ${{ steps.resolve.outputs.channel }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      pub_date: ${{ steps.resolve.outputs.pub_date }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Resolve version/channel and reconcile with pubspec
        id: resolve
        run: |
          set -euo pipefail
          # pubspec semver is the single source of truth for what we build; the
          # in-code kAppVersion is already guarded equal to it by _checks.yml.
          pubspec_ver="$(grep -E '^version:' app/pubspec.yaml | head -n1 \
            | sed -E 's/^version:[[:space:]]*//' | tr -d '[:space:]')"
          pubspec_semver="${pubspec_ver%%+*}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # No tag on a manual run; name artifacts after the built version.
            version="$pubspec_semver"
          else
            version="${GITHUB_REF_NAME#v}"   # v0.1.0 -> 0.1.0, v0.1.0-beta.1 -> 0.1.0-beta.1
          fi

          core="${version%%-*}"              # strip any prerelease suffix
          if [ "$core" != "$pubspec_semver" ]; then
            echo "::error::tag version core ($core) != app/pubspec.yaml semver ($pubspec_semver)"
            exit 1
          fi

          case "$version" in
            *-*) channel="beta";   prerelease="true"  ;;
            *)   channel="stable"; prerelease="false" ;;
          esac

          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          {
            echo "version=$version"
            echo "tag=v$version"
            echo "channel=$channel"
            echo "prerelease=$prerelease"
            echo "pub_date=$pub_date"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved: version=$version tag=v$version channel=$channel prerelease=$prerelease"

      # Fail-fast (A12): a STABLE release must ship hand-written notes, so a
      # plain x.y.z tag with no matching `## [x.y.z]` section in
      # app/CHANGELOG.md is rejected here in the cheap meta job — BEFORE the
      # 3-OS build matrix. A prerelease (beta/rc) is allowed through and falls
      # back to a loud "add notes" draft body at publish time. Guarded to tag
      # pushes so a build-only workflow_dispatch dry run is never blocked.
      - name: Require a CHANGELOG section for stable releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
          CHANNEL: ${{ steps.resolve.outputs.channel }}
        run: |
          set -euo pipefail
          python3 tools/release/gen_release_notes.py --check \
            --version "$VERSION" \
            --tag "$TAG" \
            --channel "$CHANNEL" \
            --changelog app/CHANGELOG.md

  # Same lint/analyze/test gate PRs pass — single-sourced from A5's reusable
  # workflow so a release can never ship code the PR gate would reject.
  checks:
    name: Reusable checks
    if: >-
      github.repository == 'ibanner56/CallersCompendium' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/_checks.yml

  build:
    name: Build + package (${{ matrix.platform }})
    needs: [meta, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            os: ubuntu-latest
          - platform: macos
            arch: universal
            os: macos-latest
          - platform: windows
            arch: x64
            os: windows-latest
          # Android ships a single signed universal (fat) APK. The name matches
          # the client's UpdateArch.universal and gen_release_metadata's
          # _EXT_PRIORITY['android']==['apk'], so the manifest entry + SHA256SUMS
          # are produced automatically. This leg is a clean NO-OP that still
          # succeeds when the signing secrets are absent (see the gate below), so
          # merging never changes the current release output and never publishes
          # a debug-signed APK.
          - platform: android
            arch: universal
            os: ubuntu-latest
          # iOS is store-delivered (ADR-002): the signed .ipa goes to TestFlight
          # via the App Store Connect API, NOT to the GitHub Release. So this leg
          # deliberately stages NOTHING under dist/ and its .ipa is uploaded as a
          # non-`dist-*` workflow artifact (see below) so it never lands in
          # SHA256SUMS / the channel manifest / the SLSA subject glob. Like the
          # android/macos legs it is a clean NO-OP when the Apple API-key secrets
          # are absent (see the iOS signing gate below). arch:universal names the
          # workflow artifact only — an .ipa is a single device-family-agnostic
          # bundle (iPhone + iPad).
          - platform: ios
            arch: universal
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Android signing gate. `secrets` context is NOT allowed in a step-level
      # `if:`, so read the keystore secret via `env:` here and export a plain
      # step output (`signing=configured|missing`) that the android build/package
      # steps below gate on. When the secret is absent (secrets not yet added by
      # the maintainer) the android leg is a clean no-op: it stages NO apk and
      # still succeeds. `mkdir -p dist` keeps the shared "List/Upload" steps happy
      # on that skip path.
      - name: Determine Android signing availability
        if: matrix.platform == 'android'
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "signing=configured" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets configured; building + staging a signed APK."
          else
            echo "signing=missing" >> "$GITHUB_OUTPUT"
            echo "::notice::Android signing secrets not configured; skipping Android release artifact"
          fi

      # macOS signing gate, mirroring the Android gate above. The `secrets`
      # context can't be used in a step-level `if:`, so read the Apple secrets
      # via `env:` and export a plain `signing=configured|missing` output that
      # the macOS sign/package steps below gate on. `signing=configured` ONLY
      # when the full Developer ID cert set AND all three notarytool credentials
      # are present; otherwise `signing=missing` and the macOS leg builds exactly
      # as today (UNSIGNED zip + dmg, no failure) until the maintainer adds the
      # Apple secrets. Names are never interpolated into a `run:` line.
      - name: Determine macOS signing availability
        if: matrix.platform == 'macos'
        id: macos_signing
        env:
          APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_DEVELOPER_ID_CERT_P12:-}" ] \
            && [ -n "${APPLE_CERT_PASSWORD:-}" ] \
            && [ -n "${APPLE_TEAM_ID:-}" ] \
            && [ -n "${APPLE_API_KEY_P8:-}" ] \
            && [ -n "${APPLE_API_KEY_ID:-}" ] \
            && [ -n "${APPLE_API_ISSUER_ID:-}" ]; then
            echo "signing=configured" >> "$GITHUB_OUTPUT"
            echo "macOS Developer ID signing secrets configured; signing + notarizing the macOS artifacts."
          else
            echo "signing=missing" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS signing secrets not configured; producing UNSIGNED macOS artifacts (unchanged from today)."
          fi

      # iOS signing gate, mirroring the macOS/Android gates above. iOS has NO
      # sideload/unsigned path (Apple-only distribution), so unlike the desktop
      # legs there is no "unsigned fallback" — when the App Store Connect API-key
      # secrets are absent the whole iOS leg is a clean no-op (it stages nothing
      # and still succeeds). `signing=configured` ONLY when the full signing set
      # is present: the App Store Connect API key (base64 .p8, key id, issuer id),
      # the team id, the Apple Distribution certificate (base64 .p12 + its
      # password), AND the App Store provisioning profile (base64
      # .mobileprovision). Secrets arrive via `env:` (never a step-level `if:`);
      # names are never interpolated into a `run:` line. `mkdir -p dist` keeps the
      # shared List/Upload steps happy on the no-op path.
      - name: Determine iOS signing availability
        if: matrix.platform == 'ios'
        id: ios_signing
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          APPLE_DISTRIBUTION_PROFILE: ${{ secrets.APPLE_DISTRIBUTION_PROFILE }}
          APPLE_SHAREEXT_DISTRIBUTION_PROFILE: ${{ secrets.APPLE_SHAREEXT_DISTRIBUTION_PROFILE }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -n "${APPLE_API_KEY_P8:-}" ] \
            && [ -n "${APPLE_API_KEY_ID:-}" ] \
            && [ -n "${APPLE_API_ISSUER_ID:-}" ] \
            && [ -n "${APPLE_TEAM_ID:-}" ] \
            && [ -n "${APPLE_DISTRIBUTION_CERT_P12:-}" ] \
            && [ -n "${APPLE_DISTRIBUTION_CERT_PASSWORD:-}" ] \
            && [ -n "${APPLE_DISTRIBUTION_PROFILE:-}" ] \
            && [ -n "${APPLE_SHAREEXT_DISTRIBUTION_PROFILE:-}" ]; then
            echo "signing=configured" >> "$GITHUB_OUTPUT"
            echo "iOS App Store Connect API-key + distribution cert secrets configured; archiving + signing the .ipa (and uploading to TestFlight on a tag)."
          else
            echo "signing=missing" >> "$GITHUB_OUTPUT"
            echo "::notice::iOS signing secrets not fully configured (need the App Store Connect API key, team id, distribution .p12 + password, the App Store provisioning profile, and the ShareExtension App Store provisioning profile); skipping the iOS/TestFlight leg."
          fi

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      # subosito/flutter-action does NOT install a JDK, and an Android Gradle
      # build needs one. We pin JDK 21 (not 17) specifically because the release
      # leg runs Android Lint's release-only `lintVitalAnalyzeRelease` task: AGP
      # 9.3.x bundles a lint whose IntelliJ platform (intellij-core 32.3.x) ships
      # a JavaDocParser that calls java.util.List.removeLast() — a JDK 21 API
      # (JEP 431, SequencedCollection) — yet is compiled to Java 8 bytecode. It
      # links but throws NoSuchMethodError on JDK < 21 while parsing any inline
      # Javadoc tag (e.g. in the file_selector_android plugin), which is exactly
      # what crashed `flutter build apk --release` here. Running Gradle on JDK 21
      # resolves the method so release lint stays ENABLED and completes. See
      # https://issuetracker.google.com/issues/522845800. The app still targets
      # Java 17 bytecode (app/android/app/build.gradle.kts is unchanged); only the
      # JVM that runs Gradle/lint is bumped. Only set it up when we're actually
      # going to build a signed APK (android + secrets present).
      - name: Set up JDK 21 (Temurin)
        if: matrix.platform == 'android' && steps.android_signing.outputs.signing == 'configured'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      # --- Linux: tar.gz (portable) + AppImage -----------------------------
      - name: Build Linux release bundle
        if: matrix.platform == 'linux'
        working-directory: app
        run: flutter build linux --release

      - name: Package Linux (tar.gz + AppImage)
        if: matrix.platform == 'linux'
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          set -euo pipefail
          bundle="app/build/linux/x64/release/bundle"
          mkdir -p dist

          # Portable tar.gz: extraction yields a single named directory.
          stage="CallersCompendium-${VERSION}-linux-x64"
          rm -rf "$stage" && cp -r "$bundle" "$stage"
          tar -czf "dist/${stage}.tar.gz" "$stage"

          # AppImage: build an AppDir from the committed recipe, then pack with a
          # pinned + checksummed appimagetool and a pinned runtime (no network
          # runtime fetch, no FUSE needed via --appimage-extract-and-run).
          curl -fsSL -o appimagetool "$APPIMAGETOOL_URL"
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          curl -fsSL -o runtime-x86_64 "$RUNTIME_URL"
          echo "${RUNTIME_SHA256}  runtime-x86_64" | sha256sum -c -

          appdir="AppDir"
          rm -rf "$appdir" && mkdir -p "$appdir/usr/bin"
          cp -r "$bundle"/. "$appdir/usr/bin/"
          install -m 0755 packaging/linux/AppRun "$appdir/AppRun"
          cp packaging/linux/compendium_app.desktop "$appdir/compendium_app.desktop"
          cp packaging/linux/icon.png "$appdir/compendium_app.png"

          # APPIMAGE_EXTRACT_AND_RUN lets appimagetool (itself an AppImage) run
          # without FUSE on CI; --runtime-file uses the pinned runtime (no fetch).
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool \
            --runtime-file runtime-x86_64 \
            "$appdir" "dist/CallersCompendium-${VERSION}-linux-x64.AppImage"

      # --- macOS: zip + dmg ------------------------------------------------
      # Unsigned by default (Linux/Windows parity); Developer ID-signed +
      # notarized when the Apple secrets are configured (see the macOS signing
      # gate above and the two mutually-exclusive package steps below).
      - name: Build macOS release bundle
        if: matrix.platform == 'macos'
        working-directory: app
        run: flutter build macos --release

      # UNSIGNED path (secrets absent): byte-for-byte identical to the previous
      # behaviour — a ditto zip + an hdiutil drag-to-Applications dmg, no deps.
      - name: Package macOS (zip + dmg)
        if: matrix.platform == 'macos' && steps.macos_signing.outputs.signing == 'missing'
        run: |
          set -euo pipefail
          app_path="app/build/macos/Build/Products/Release/compendium_app.app"
          mkdir -p dist

          # Informational: confirm the produced binary is a universal (fat) Mach-O.
          lipo -info "$app_path/Contents/MacOS/compendium_app" || true

          # Portable zip (ditto preserves macOS bundle metadata / symlinks).
          ditto -c -k --keepParent "$app_path" \
            "dist/CallersCompendium-${VERSION}-macos-universal.zip"

          # Drag-to-Applications style .dmg via the built-in hdiutil (no deps).
          stage="dmg_stage"
          rm -rf "$stage" && mkdir -p "$stage"
          cp -R "$app_path" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Caller's Compendium" -srcfolder "$stage" \
            -ov -format UDZO "dist/CallersCompendium-${VERSION}-macos-universal.dmg"

      # SIGNED path (secrets present): deep-codesign the .app with the hardened
      # runtime, build + sign the .dmg, notarize with notarytool, staple the
      # ticket to BOTH the .app (before zipping, so the zip carries a stapled
      # bundle) and the .dmg, then verify as a hard gate. The whole flow lives in
      # one step so the ephemeral keychain never has to be handed across steps;
      # the always() cleanup step below deletes it. Secrets arrive via `env:` and
      # are only ever decoded to files with `base64 -D` (never echoed), and
      # `set -x` is deliberately NOT used so nothing sensitive reaches the log.
      - name: Sign, notarize & package macOS (Developer ID)
        if: matrix.platform == 'macos' && steps.macos_signing.outputs.signing == 'configured'
        env:
          APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          app_path="app/build/macos/Build/Products/Release/compendium_app.app"
          entitlements="app/macos/Runner/Release.entitlements"
          dmg="dist/CallersCompendium-${VERSION}-macos-universal.dmg"
          zip="dist/CallersCompendium-${VERSION}-macos-universal.zip"
          mkdir -p dist

          # Informational: confirm the produced binary is a universal (fat) Mach-O.
          lipo -info "$app_path/Contents/MacOS/compendium_app" || true

          # ---- 1. Ephemeral, dedicated signing keychain ---------------------
          # A throwaway keychain (random password, fixed path so the always()
          # cleanup step can find it) holds the imported Developer ID cert+key.
          keychain="$RUNNER_TEMP/cc-signing.keychain-db"
          keychain_pw="$(openssl rand -base64 24)"
          cert_p12="$RUNNER_TEMP/cc-developer-id.p12"
          api_key="$RUNNER_TEMP/cc-asc-api-key.p8"

          # macOS runners ship BSD base64; `-D` (decode) is the portable flag
          # there (GNU's `--decode` isn't guaranteed on older runner images).
          printf '%s' "$APPLE_DEVELOPER_ID_CERT_P12" | base64 -D > "$cert_p12"
          printf '%s' "$APPLE_API_KEY_P8" | base64 -D > "$api_key"

          security create-keychain -p "$keychain_pw" "$keychain"
          # Keep it unlocked for the whole job (no idle auto-lock during notarize).
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          # Import cert+key; allowlist codesign/security so no UI prompt is needed.
          security import "$cert_p12" -k "$keychain" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          # Prepend our keychain to the user search list, preserving the rest.
          # shellcheck disable=SC2046  # intentional split: each path is its own arg
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | sed 's/"//g')
          # Let codesign use the imported private key non-interactively.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_pw" "$keychain" >/dev/null

          # Resolve the Developer ID Application identity for this team, by its
          # SHA-1 (unambiguous) rather than a hardcoded name. Fail loudly if the
          # imported cert isn't a Developer ID Application cert for APPLE_TEAM_ID.
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -v team="($APPLE_TEAM_ID)" \
                '/Developer ID Application/ && index($0, team) {print $2; exit}')"
          if [ -z "${identity:-}" ]; then
            echo "::error::No 'Developer ID Application' code-signing identity for team ${APPLE_TEAM_ID} was found in the imported certificate." >&2
            exit 1
          fi
          echo "Resolved Developer ID Application identity: ${identity}"

          # ---- 2. Deep-codesign the .app (hardened runtime), inside-out -----
          # Sign nested Mach-O FIRST (dylibs, then framework/xpc/helper bundles),
          # THEN the outer app bundle with entitlements. --options runtime turns
          # on the hardened runtime, --timestamp is required for notarization,
          # --force re-signs anything Flutter already ad-hoc signed.
          sign() {
            codesign --force --options runtime --timestamp --sign "$identity" "$1"
          }
          while IFS= read -r -d '' f; do sign "$f"; done \
            < <(find "$app_path/Contents" -type f -name '*.dylib' -print0)
          while IFS= read -r -d '' f; do sign "$f"; done \
            < <(find "$app_path/Contents" -type d -name '*.framework' -print0)
          while IFS= read -r -d '' f; do sign "$f"; done \
            < <(find "$app_path/Contents" -type d -name '*.xpc' -print0)
          while IFS= read -r -d '' f; do sign "$f"; done \
            < <(find "$app_path/Contents" -type d -name '*.app' ! -path "$app_path" -print0)
          codesign --force --options runtime --timestamp \
            --entitlements "$entitlements" --sign "$identity" "$app_path"

          # ---- 3. Build the .dmg (same hdiutil recipe) and sign it ----------
          stage="dmg_stage"
          rm -rf "$stage" && mkdir -p "$stage"
          cp -R "$app_path" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Caller's Compendium" -srcfolder "$stage" \
            -ov -format UDZO "$dmg"
          codesign --force --timestamp --sign "$identity" "$dmg"

          # ---- 4. Notarize the .dmg (registers the nested .app cdhash too) --
          # notarytool authenticates with an App Store Connect API key (.p8).
          # --wait blocks until Apple returns Accepted/Invalid (non-zero on
          # Invalid, which fails the step). --timeout 30m bounds that wait so a
          # backlogged Apple notary service can't hang the job for hours; if the
          # ticket isn't ready in 30 minutes notarytool exits non-zero and the
          # step fails (re-run the release once Apple's queue drains).
          xcrun notarytool submit "$dmg" \
            --key "$api_key" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --timeout 30m

          # ---- 5. Staple the ticket to the .app (pre-zip) and the .dmg ------
          # The .app's cdhash was registered by the .dmg submission above, so it
          # can be stapled directly. Stapling BEFORE the ditto zip means the zip
          # captures a stapled (offline-verifiable) bundle.
          xcrun stapler staple "$app_path"
          xcrun stapler staple "$dmg"

          # ---- 6. Zip the STAPLED, signed .app ------------------------------
          ditto -c -k --keepParent "$app_path" "$zip"

          # ---- 7. Verify as a hard gate -------------------------------------
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl -a -t exec -vvv "$app_path"
          spctl -a -t open --context context:primary-signature -vvv "$dmg"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg"

      # Always tear down the ephemeral signing keychain + decoded secret files,
      # even if signing failed. `security delete-keychain` both removes the
      # keychain from the search list and deletes the file, so we don't clobber
      # the rest of the user search list. A no-op on the unsigned path (the
      # keychain + secret files never existed).
      - name: Clean up macOS signing keychain
        if: always() && matrix.platform == 'macos'
        run: |
          keychain="$RUNNER_TEMP/cc-signing.keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/cc-developer-id.p12" \
                "$RUNNER_TEMP/cc-asc-api-key.p8" 2>/dev/null || true
          exit 0

      # --- iOS: signed App Store archive + TestFlight upload ----------------
      # Xcode signs the App Store build with the team's Apple Distribution
      # certificate, imported from a base64 .p12 secret into an ephemeral
      # keychain, plus a pre-provisioned App Store profile (base64 secret)
      # installed onto the runner. The archive uses automatic signing (a
      # development identity, which cloud signing CAN mint) and the export uses
      # MANUAL signing to re-sign with the local distribution identity + that
      # profile. Automatic/cloud signing cannot be used for the distribution
      # export: the distribution cert is not Apple-managed, so cloud signing
      # fails with "Cloud signing permission error / no profiles found". The App
      # Store Connect API key still drives the archive's development signing
      # (-allowProvisioningUpdates) and the TestFlight upload; it needs the App
      # Manager role (Developer is not enough).
      #
      # Secrets arrive via `env:` and are only ever decoded to files with
      # `base64 -D` (never echoed); `set -x` is deliberately NOT used. The .p8 is
      # written to the two dirs xcodebuild + altool auto-search
      # (~/.appstoreconnect/private_keys and ~/.private_keys) as
      # AuthKey_<KEYID>.p8; the .p12 is imported into an ephemeral keychain under
      # $RUNNER_TEMP; the provisioning profile is installed under
      # ~/Library/Developer/Xcode/UserData/Provisioning Profiles (+ the classic
      # MobileDevice dir). DEVELOPMENT_TEAM (absent from the checked-in project)
      # is injected into Release.xcconfig so signing has a team. The always()
      # cleanup step removes the key material, deletes the keychain + profile,
      # and reverts the xcconfig.
      - name: Prepare iOS signing (App Store Connect API key)
        if: matrix.platform == 'ios' && steps.ios_signing.outputs.signing == 'configured'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERT_P12: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          APPLE_DISTRIBUTION_PROFILE: ${{ secrets.APPLE_DISTRIBUTION_PROFILE }}
          APPLE_SHAREEXT_DISTRIBUTION_PROFILE: ${{ secrets.APPLE_SHAREEXT_DISTRIBUTION_PROFILE }}
        run: |
          set -euo pipefail
          # App Store Connect API key, in BOTH well-known locations that
          # xcodebuild (automatic signing) and altool (upload) auto-discover.
          asc_dir="$HOME/.appstoreconnect/private_keys"
          alt_dir="$HOME/.private_keys"
          mkdir -p "$asc_dir" "$alt_dir"
          # macOS runners ship BSD base64; `-D` (decode) is the portable flag.
          printf '%s' "$APPLE_API_KEY_P8" | base64 -D > "$asc_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          cp "$asc_dir/AuthKey_${APPLE_API_KEY_ID}.p8" "$alt_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$asc_dir/AuthKey_${APPLE_API_KEY_ID}.p8" \
                    "$alt_dir/AuthKey_${APPLE_API_KEY_ID}.p8"

          # Import the Apple Distribution certificate (+ its private key) from the
          # base64 .p12 secret into an ephemeral keychain, so xcodebuild signs the
          # App Store build with this LOCAL identity instead of failing over to
          # cloud signing (which cannot mint this non-Apple-managed cert).
          keychain="$RUNNER_TEMP/cc-ios.keychain-db"
          kc_pass="$(openssl rand -base64 24)"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          p12="$RUNNER_TEMP/dist.p12"
          printf '%s' "$APPLE_DISTRIBUTION_CERT_P12" | base64 -D > "$p12"
          security import "$p12" -k "$keychain" -P "$APPLE_DISTRIBUTION_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild -f pkcs12
          rm -f "$p12"
          # Let codesign/xcodebuild use the private key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" >/dev/null
          # Prepend our keychain to the user search list (keeping the existing
          # entries) so xcodebuild can find the imported signing identity.
          # Read existing keychains line-by-line into an array so paths that
          # contain spaces (possible on custom/self-hosted runners) survive:
          # word-splitting an unquoted string would corrupt them.
          existing_keychains=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"   # trim leading whitespace
            line="${line%"${line##*[![:space:]]}"}"   # trim trailing whitespace
            line="${line#\"}"; line="${line%\"}"       # strip wrapping quotes
            if [ -n "$line" ]; then existing_keychains+=("$line"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing_keychains[@]}"
          security find-identity -v -p codesigning "$keychain"

          # Install the App Store provisioning profile so MANUAL export signing
          # can find it (ExportOptions.plist below references it by UUID).
          # Automatic export signing insists on cloud
          # signing for the distribution identity (which fails: our distribution
          # cert is not Apple-managed), so the export below uses signingStyle
          # manual against this pre-provisioned profile + the imported cert. The
          # profile is a CMS-signed plist; decode it to read its UUID and install
          # under the file name Xcode expects. Xcode 16 and later (including the
          # Xcode 26 on GitHub's macOS runners) reads profiles from
          # ~/Library/Developer/Xcode/UserData/Provisioning Profiles; also drop a
          # copy in the classic ~/Library/MobileDevice location for safety.
          prof_raw="$RUNNER_TEMP/cc_appstore.mobileprovision"
          printf '%s' "$APPLE_DISTRIBUTION_PROFILE" | base64 -D > "$prof_raw"
          prof_plist="$RUNNER_TEMP/cc_appstore.plist"
          security cms -D -i "$prof_raw" > "$prof_plist"
          prof_uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$prof_plist")
          if [ -z "$prof_uuid" ]; then
            echo "::error::Could not read a UUID from the App Store distribution profile (APPLE_DISTRIBUTION_PROFILE); it is likely empty or malformed." >&2
            exit 1
          fi
          prof_name=$(/usr/libexec/PlistBuddy -c "Print :Name" "$prof_plist")
          echo "Installing provisioning profile '${prof_name}' (${prof_uuid})"
          # Persist the UUID so the cleanup step removes ONLY this profile
          # (never a blanket wipe of the runner's profile dirs).
          printf '%s' "$prof_uuid" > "$RUNNER_TEMP/cc-ios-profile-uuid"
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                     "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$prof_raw" "$dir/${prof_uuid}.mobileprovision"
          done

          # Install the ShareExtension's App Store distribution profile too.
          # Issue #343 (#394) added a Share Extension target
          # (org.callerscompendium.compendiumApp.ShareExtension) with an App
          # Group entitlement. App Store export signs every EMBEDDED target, so
          # the extension needs its own distribution profile in addition to the
          # host app's — installed and mapped in ExportOptions exactly like the
          # main profile above.
          ext_prof_raw="$RUNNER_TEMP/cc_appstore_shareext.mobileprovision"
          printf '%s' "$APPLE_SHAREEXT_DISTRIBUTION_PROFILE" | base64 -D > "$ext_prof_raw"
          ext_prof_plist="$RUNNER_TEMP/cc_appstore_shareext.plist"
          security cms -D -i "$ext_prof_raw" > "$ext_prof_plist"
          ext_prof_uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$ext_prof_plist")
          if [ -z "$ext_prof_uuid" ]; then
            echo "::error::Could not read a UUID from the ShareExtension App Store distribution profile (APPLE_SHAREEXT_DISTRIBUTION_PROFILE); it is likely empty or malformed." >&2
            exit 1
          fi
          ext_prof_name=$(/usr/libexec/PlistBuddy -c "Print :Name" "$ext_prof_plist")
          echo "Installing ShareExtension provisioning profile '${ext_prof_name}' (${ext_prof_uuid})"
          printf '%s' "$ext_prof_uuid" > "$RUNNER_TEMP/cc-ios-shareext-profile-uuid"
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                     "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$ext_prof_raw" "$dir/${ext_prof_uuid}.mobileprovision"
          done

          # Give automatic signing a team. Release.xcconfig only #includes the
          # ephemeral Generated.xcconfig today; append a team line (reverted in
          # cleanup). The team id is not secret, but sourcing it from the secret
          # keeps the checked-in project team-agnostic.
          printf 'DEVELOPMENT_TEAM=%s\n' "$APPLE_TEAM_ID" >> app/ios/Flutter/Release.xcconfig

          # ExportOptions for the xcodebuild -exportArchive step, built with
          # PlistBuddy so no
          # heredoc indentation leaks into the file. `app-store` is accepted by
          # every Xcode the runner is likely to ship (newer Xcode may emit a
          # non-fatal deprecation notice for the renamed `app-store-connect`).
          # destination=export keeps the build local; the actual TestFlight
          # upload is a separate, tag-gated altool step below.
          # manageAppVersionAndBuildNumber=false so our --build-number stays
          # authoritative (TestFlight rejects duplicate build numbers).
          # signingStyle=manual with an explicit signingCertificate +
          # provisioningProfiles map: the distribution cert is imported LOCALLY
          # and its profile is pre-installed above, so export never touches cloud
          # signing (which cannot mint this non-Apple-managed distribution cert).
          # The profile is referenced by UUID (not name): profile names contain
          # spaces/parens that PlistBuddy would mis-tokenize, whereas the UUID is
          # a bare token and xcodebuild accepts either.
          plist="$RUNNER_TEMP/ExportOptions.plist"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict></dict></plist>' > "$plist"
          /usr/libexec/PlistBuddy \
            -c "Add :method string app-store" \
            -c "Add :signingStyle string manual" \
            -c "Add :teamID string ${APPLE_TEAM_ID}" \
            -c "Add :signingCertificate string Apple Distribution" \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:org.callerscompendium.compendiumApp string ${prof_uuid}" \
            -c "Add :provisioningProfiles:org.callerscompendium.compendiumApp.ShareExtension string ${ext_prof_uuid}" \
            -c "Add :destination string export" \
            -c "Add :uploadSymbols bool true" \
            -c "Add :manageAppVersionAndBuildNumber bool false" \
            "$plist"

      - name: Build signed iOS .ipa (App Store archive)
        if: matrix.platform == 'ios' && steps.ios_signing.outputs.signing == 'configured'
        working-directory: app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Monotonic, unique CFBundleVersion so TestFlight never rejects a
          # duplicate build number. GITHUB_RUN_NUMBER only ever increases, but it
          # is reused when a run is re-run, so fold in GITHUB_RUN_ATTEMPT (starts
          # at 1, increments per re-run) to keep re-runs unique too. The result
          # stays a single monotonic integer (attempts are << 1000). We pass it on
          # the CLI so app/pubspec.yaml (0.1.0+1) is untouched and the meta/version
          # gate (tag core == pubspec semver) stays green.
          build_number=$(( GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT ))
          echo "Using CFBundleVersion (build number): ${build_number}"

          # Keep the Share Extension's version + build in lockstep with the host
          # app. `flutter build --build-number` only stamps the Runner target via
          # Generated.xcconfig; the ShareExtension (issue #343) has its own
          # Info.plist and does NOT include the Flutter xcconfig, so its
          # CFBundleShortVersionString / CFBundleVersion would otherwise stay the
          # checked-in placeholder (1.0 / 1). App Store validation REJECTS an
          # embedded extension whose version or build differs from the host, so
          # stamp them here to the pubspec marketing version + this build number.
          # Reverted by the always() cleanup step (git checkout), mirroring how
          # the DEVELOPMENT_TEAM line is appended to Release.xcconfig above.
          build_name="$(sed -n 's/^version:[[:space:]]*\([^+]*\).*/\1/p' pubspec.yaml | tr -d '[:space:]')"
          if [ -z "$build_name" ]; then
            echo "::error::Could not parse a marketing version from app/pubspec.yaml ('version:') to stamp the ShareExtension." >&2
            exit 1
          fi
          echo "Stamping ShareExtension version ${build_name} (${build_number})"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString ${build_name}" \
            -c "Set :CFBundleVersion ${build_number}" \
            ios/ShareExtension/Info.plist

          # `flutter build ipa` cannot forward the App Store Connect API-key
          # credentials to its internal `xcodebuild archive`, so that archive
          # has no account and fails automatic signing with "No Accounts".
          # Instead: (1) build the Flutter assets + generated project UNSIGNED,
          # then (2) archive and (3) export with xcodebuild directly.
          # (2) The archive uses AUTOMATIC signing: -allowProvisioningUpdates +
          # the API key let Xcode mint/download a DEVELOPMENT identity + profile
          # solely to produce the archive (the cloud can mint dev identities).
          # (3) The export re-signs with MANUAL signing against the LOCALLY-
          # imported distribution cert + the pre-installed App Store profile
          # (no portal access), so a dev-signed archive is a fine input.
          key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

          # 1) Flutter build — populates Generated.xcconfig (incl. the build
          #    number) and compiles the Dart/asset bundle. --no-codesign because
          #    xcodebuild signs during the archive below.
          flutter build ios --release --no-codesign --build-number="${build_number}"

          # 2) Archive with automatic, API-key-authenticated signing.
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

          # 3) Export the App Store .ipa to app/build/ios/ipa (the path the
          #    TestFlight upload + artifact-upload steps below already glob).
          #    Manual signing: uses the LOCAL distribution identity + the
          #    pre-installed profile from ExportOptions — NO cloud signing, NO
          #    -allowProvisioningUpdates (which would re-trigger the failing
          #    cloud distribution signing).
          rm -rf build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$PWD/build/ios/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          ls -l build/ios/ipa

      # Upload to TestFlight ONLY on a real tag push — a manual workflow_dispatch
      # builds + signs the .ipa for validation but never uploads (so dry runs
      # don't spam TestFlight), mirroring how the desktop publish is tag-gated.
      - name: Upload iOS build to TestFlight
        if: >-
          matrix.platform == 'ios' &&
          steps.ios_signing.outputs.signing == 'configured' &&
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # nullglob so an unmatched pattern expands to nothing (rather than the
          # literal "*.ipa" string), giving a real empty-vs-found check.
          shopt -s nullglob
          ipas=(app/build/ios/ipa/*.ipa)
          shopt -u nullglob
          if [ "${#ipas[@]}" -eq 0 ]; then
            echo "::error::no .ipa found under app/build/ios/ipa" >&2
            exit 1
          fi
          if [ "${#ipas[@]}" -gt 1 ]; then
            echo "::error::expected exactly one .ipa, found ${#ipas[@]}: ${ipas[*]}" >&2
            exit 1
          fi
          ipa="${ipas[0]}"
          echo "Uploading $ipa to App Store Connect (TestFlight, internal testers)."
          # altool finds AuthKey_<KEYID>.p8 in the private_keys dirs written by
          # the prepare step. --upload-app makes the build available to INTERNAL
          # TestFlight testers automatically; it does NOT submit to Beta App
          # Review or the public App Store.
          xcrun altool --upload-app \
            -f "$ipa" \
            -t ios \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"

      # Keep the signed .ipa as a workflow artifact for validation/debugging.
      # The name is OUTSIDE the `dist-*` namespace the publish job downloads
      # (pattern: dist-*), so it is never merged into the GitHub Release,
      # SHA256SUMS, the channel manifest, or the SLSA subject glob — iOS is
      # store-delivered (ADR-002), not a direct download.
      - name: Upload iOS .ipa artifact
        if: matrix.platform == 'ios' && steps.ios_signing.outputs.signing == 'configured'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-ipa
          path: app/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      # Always tear down the decoded API key material + revert the injected
      # DEVELOPMENT_TEAM, even if the build/upload failed. A no-op on the skip
      # path (nothing was written). The key id may be empty on that path, so the
      # rm targets are guarded with a default.
      - name: Clean up iOS signing material
        if: always() && matrix.platform == 'ios'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key_id="${APPLE_API_KEY_ID:-__none__}"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${key_id}.p8" \
                "$HOME/.private_keys/AuthKey_${key_id}.p8" 2>/dev/null || true
          security delete-keychain "$RUNNER_TEMP/cc-ios.keychain-db" 2>/dev/null || true
          # Remove ONLY the profile this workflow installed (by UUID), never a
          # blanket wipe that could delete unrelated profiles on the runner.
          prof_uuid="$(cat "$RUNNER_TEMP/cc-ios-profile-uuid" 2>/dev/null || true)"
          if [ -n "$prof_uuid" ]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${prof_uuid}.mobileprovision" \
                  "$HOME/Library/MobileDevice/Provisioning Profiles/${prof_uuid}.mobileprovision" 2>/dev/null || true
          fi
          ext_prof_uuid="$(cat "$RUNNER_TEMP/cc-ios-shareext-profile-uuid" 2>/dev/null || true)"
          if [ -n "$ext_prof_uuid" ]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${ext_prof_uuid}.mobileprovision" \
                  "$HOME/Library/MobileDevice/Provisioning Profiles/${ext_prof_uuid}.mobileprovision" 2>/dev/null || true
          fi
          # Remove the decoded profile/plist + generated ExportOptions + UUID
          # marker from $RUNNER_TEMP (derived from secrets; $RUNNER_TEMP is
          # ephemeral, but tear them down explicitly per the cleanup contract).
          rm -f "$RUNNER_TEMP/cc_appstore.mobileprovision" \
                "$RUNNER_TEMP/cc_appstore.plist" \
                "$RUNNER_TEMP/cc_appstore_shareext.mobileprovision" \
                "$RUNNER_TEMP/cc_appstore_shareext.plist" \
                "$RUNNER_TEMP/ExportOptions.plist" \
                "$RUNNER_TEMP/cc-ios-profile-uuid" \
                "$RUNNER_TEMP/cc-ios-shareext-profile-uuid" \
                "$RUNNER_TEMP/dist.p12" 2>/dev/null || true
          git checkout -- app/ios/Flutter/Release.xcconfig 2>/dev/null || true
          git checkout -- app/ios/ShareExtension/Info.plist 2>/dev/null || true
          exit 0

      # --- Windows: zip (portable) + Inno Setup installer ------------------
      - name: Build Windows release bundle
        if: matrix.platform == 'windows'
        working-directory: app
        run: flutter build windows --release

      - name: Package Windows (zip + installer)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = "app/build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # Portable zip: extraction yields a single named directory.
          $stage = "CallersCompendium-$env:VERSION-windows-x64"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          Copy-Item -Recurse $release $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$stage.zip" -Force

          # Installer via Inno Setup (preinstalled on windows-latest; fall back
          # to Chocolatey if the image ever drops it). The fallback is fully
          # supply-chain hardened (#451): every Chocolatey package it needs is
          # PINNED to a specific version and its .nupkg SHA-512 is verified
          # (fail-closed) against the community feed's published PackageHash
          # BEFORE any install runs, and the install resolves EXCLUSIVELY from
          # the verified local directory (no live feed). Nothing unverified is
          # fetched or executed at install time — this matters because a
          # Chocolatey package's (and its dependencies') install-time PowerShell
          # runs in the release job, so hashing only the Inno Setup .nupkg would
          # still leave the dependency chain trusting the live feed.
          #
          # The pinned set below is the COMPLETE dependency tree (resolved and
          # verified transitively; the leaf has no further dependencies):
          #   innosetup 6.7.1
          #     -> chocolatey-core.extension 1.4.0
          #          -> chocolatey-compatibility.extension 1.0.0 (no deps)
          # innosetup 6.7.1 is the latest stable on the community feed (published
          # 2026-02-17). Each Sha512 is the hex SHA-512 of that exact .nupkg and
          # matches the feed's published PackageHash. Bump version + Sha512
          # together when updating any package, and re-check the dependency tree.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $innoPackages = @(
              @{ Id = 'innosetup';                         Version = '6.7.1'; Sha512 = '431A9F0A8D40D95F8A04C8D98617D2F6E88AC08B65A01BE1F272D6978C3F726AE118F9D7DC04C2B52A429DDEC3D491358A1C8BF2F77DEEE0ABDA8606A975EB61' }
              @{ Id = 'chocolatey-core.extension';          Version = '1.4.0'; Sha512 = '78F66C4259BC7AEAFC177EFD6CE1988112B3EF7FC436D330DBE7EF601308A1795EB94D4E117731A3BEE118439E5809FB05927B065E14D0C69F4E2F93BDC7E11B' }
              @{ Id = 'chocolatey-compatibility.extension'; Version = '1.0.0'; Sha512 = '7117C2BFDD36396A0151110E21D3E9592E72EC79BEAA9B1C06911E2745F6202D6A364A028452873CCFD7F07D237AEB4EFE8FFAB43FF8B8D4A652E7915A32568D' }
            )
            $pkgDir = Join-Path $env:RUNNER_TEMP 'innosetup-pkg'
            New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
            foreach ($pkg in $innoPackages) {
              $nupkg = Join-Path $pkgDir "$($pkg.Id).$($pkg.Version).nupkg"
              Invoke-WebRequest -UseBasicParsing `
                -Uri "https://community.chocolatey.org/api/v2/package/$($pkg.Id)/$($pkg.Version)" `
                -OutFile $nupkg
              $actualSha512 = (Get-FileHash -Algorithm SHA512 -Path $nupkg).Hash
              if ($actualSha512 -ne $pkg.Sha512) {
                throw "$($pkg.Id) $($pkg.Version) package SHA-512 mismatch: expected $($pkg.Sha512), got $actualSha512"
              }
            }
            # Install ONLY from the verified local dir (no community feed), so
            # every package — including the dependency chain — comes from bytes
            # we just hash-verified. --require-checksums is defense-in-depth.
            choco install innosetup --version 6.7.1 -y --no-progress --require-checksums --source "$pkgDir"
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed ($LASTEXITCODE)" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }

          # Inno resolves relative [Files] Source paths against the .iss dir, so
          # pass ABSOLUTE source/output dirs.
          $releaseAbs = (Resolve-Path $release).Path
          $distAbs = (Resolve-Path dist).Path
          & "$iscc" `
            "/DMyAppVersion=$env:VERSION" `
            "/DSourceDir=$releaseAbs" `
            "/DOutputDir=$distAbs" `
            "/DOutputBaseName=CallersCompendium-$env:VERSION-windows-x64" `
            packaging\windows\CallersCompendium.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }

      # --- Android: signed universal APK -----------------------------------
      # Reconstruct the upload keystore + key.properties from repo secrets at
      # runtime, under app/android/ (already gitignored). Secrets are passed via
      # `env:` and never interpolated into the `run:` script, so they can't leak
      # into the build log. app/android/app/build.gradle.kts then picks up the
      # release signingConfig because key.properties now exists (each field is
      # `?: error(...)`, so a misconfigured secret fails the build loudly rather
      # than silently producing a debug-signed APK).
      - name: Reconstruct Android signing config
        if: matrix.platform == 'android' && steps.android_signing.outputs.signing == 'configured'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # If the keystore secret is configured, all four must be present — fail
          # fast with a clear message rather than writing an empty field that
          # would surface as a confusing Gradle signing error later. (The message
          # names only the variable, never the value.)
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is empty/unset}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is empty/unset}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is empty/unset}"
          # storeFile is relative, so build.gradle.kts (rootProject.file) anchors
          # it at app/android/ next to key.properties.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/callerscompendium-upload.jks
          # key.properties is a java.util.Properties file, where backslashes are
          # escape chars; double them so a value with a backslash round-trips
          # verbatim. Output is redirected to the file (never echoed to the log).
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            printf '%s\n' "storeFile=callerscompendium-upload.jks"
            printf '%s\n' "storePassword=$(esc "$ANDROID_KEYSTORE_PASSWORD")"
            printf '%s\n' "keyPassword=$(esc "$ANDROID_KEY_PASSWORD")"
            printf '%s\n' "keyAlias=$(esc "$ANDROID_KEY_ALIAS")"
          } > app/android/key.properties

      - name: Build Android release APK (signed)
        if: matrix.platform == 'android' && steps.android_signing.outputs.signing == 'configured'
        working-directory: app
        run: flutter build apk --release

      - name: Package Android (signed APK)
        if: matrix.platform == 'android' && steps.android_signing.outputs.signing == 'configured'
        run: |
          set -euo pipefail
          # `flutter build apk --release` emits a universal (fat) APK here.
          apk="app/build/app/outputs/flutter-apk/app-release.apk"
          mkdir -p dist
          cp "$apk" "dist/CallersCompendium-${VERSION}-android-universal.apk"

      - name: List packaged artifacts
        run: ls -l dist

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
          # Desktop legs must always stage binaries (error on empty). The android
          # leg is a no-op when signing secrets are absent, and the ios leg never
          # stages into dist/ (its signed .ipa is store-delivered to TestFlight
          # and uploaded as the separate `ios-ipa` artifact), so both tolerate an
          # empty dist/ (no dist-android/dist-ios artifact is uploaded, step still
          # passes).
          if-no-files-found: ${{ (matrix.platform == 'android' || matrix.platform == 'ios') && 'ignore' || 'error' }}
          retention-days: 7

  # Draft-release publish. ONLY this job gets write scopes, and it runs ONLY for
  # a real tag push (never a dispatch dry-run).
  publish:
    name: Create draft release
    needs: [meta, build]
    if: >-
      github.repository == 'ibanner56/CallersCompendium' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release + upload assets
      id-token: write        # keyless SLSA build-provenance (OIDC, no secret)
      attestations: write    # store the provenance attestation
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -l dist

      # SBOM (A10): resolve the workspace dependency graph and emit a
      # deterministic CycloneDX 1.5 SBOM so downstream users can see exactly
      # which dependencies went into the build. Flutter setup mirrors ci.yml /
      # the build job (pinned action + .fvmrc, cache); `pub get` here only
      # RESOLVES the single root pubspec.lock (no build), and `dart` ships with
      # the Flutter SDK. The SBOM is named OUTSIDE the `CallersCompendium-*`
      # binary namespace so gen_release_metadata never treats it as a platform
      # binary and the build-provenance `subject-path` never globs it — it gets
      # its own attestation below and is folded into SHA256SUMS via --extra-file.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          dart pub deps --json > "$RUNNER_TEMP/deps.json"
          python3 tools/release/gen_sbom.py \
            --deps "$RUNNER_TEMP/deps.json" \
            --version "${{ needs.meta.outputs.version }}" \
            --output "dist/sbom-${{ needs.meta.outputs.version }}.cdx.json"

      - name: Generate SHA256SUMS + channel manifest
        run: |
          set -euo pipefail
          python3 tools/release/gen_release_metadata.py \
            --version "${{ needs.meta.outputs.version }}" \
            --tag "${{ needs.meta.outputs.tag }}" \
            --channel "${{ needs.meta.outputs.channel }}" \
            --repo "${{ github.repository }}" \
            --dist dist \
            --pub-date "${{ needs.meta.outputs.pub_date }}" \
            --extra-file "dist/sbom-${{ needs.meta.outputs.version }}.cdx.json"

      # Hand the freshly-generated channel manifest to the `pages` job (A11c),
      # which publishes it to the gh-pages branch so the client's fixed URL
      # (kUpdateManifestBaseUrl) resolves. Uploading just this one file keeps the
      # Pages publish decoupled from the release assets and lets `pages` run with
      # contents:write ONLY (no id-token/attestations).
      - name: Upload channel manifest for the Pages publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: channel-manifest
          path: dist/${{ needs.meta.outputs.channel }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Attest build provenance (keyless SLSA)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'dist/CallersCompendium-*'

      # Attest the SBOM (A10): binds the CycloneDX SBOM to the release binaries
      # with the same keyless (OIDC) signing as the build provenance, so users
      # can `gh attestation verify` the dependency list too. `subject-path` is
      # the BINARIES only (never the SBOM/SHA256SUMS/<channel>.json); `sbom-path`
      # is the generated CycloneDX document.
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: 'dist/CallersCompendium-*'
          sbom-path: 'dist/sbom-${{ needs.meta.outputs.version }}.cdx.json'

      # Release notes come from app/CHANGELOG.md (A12): gen_release_notes.py
      # extracts the `## [x.y.z]` section for this version, adds a beta banner
      # for prerelease tags, and appends the signing/verify/maintainer footer.
      # A missing section falls back to a loud "add notes" body (+ ::warning::)
      # rather than failing the run — the release is a DRAFT until a human
      # publishes it. Maintain notes by promoting `## [Unreleased]` before
      # tagging (see docs/dev/releasing.md).
      #
      # The footer's macOS line must match what actually happened in the build
      # matrix. macOS signing is gated on the six Apple secrets (same gate as the
      # build job's `Determine macOS signing availability` step); if any is
      # signing-configured-but-failing, the build job's verify gate fails the
      # whole run so we never reach publish. So presence of all six secrets here
      # is an accurate proxy for "macOS was Developer ID-signed + notarized",
      # which we pass as `--macos-signing` so the notes never over-claim.
      - name: Generate release notes from CHANGELOG
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
          APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          macos_signing=missing
          if [ -n "${APPLE_DEVELOPER_ID_CERT_P12:-}" ] \
            && [ -n "${APPLE_CERT_PASSWORD:-}" ] \
            && [ -n "${APPLE_TEAM_ID:-}" ] \
            && [ -n "${APPLE_API_KEY_P8:-}" ] \
            && [ -n "${APPLE_API_KEY_ID:-}" ] \
            && [ -n "${APPLE_API_ISSUER_ID:-}" ]; then
            macos_signing=configured
          fi
          python3 tools/release/gen_release_notes.py \
            --version "$VERSION" \
            --tag "$TAG" \
            --channel "$CHANNEL" \
            --macos-signing "$macos_signing" \
            --changelog app/CHANGELOG.md \
            --output release-notes.md

      - name: Create or update the DRAFT release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          files=(dist/CallersCompendium-* "dist/SHA256SUMS" "dist/${CHANNEL}.json" "dist/sbom-${VERSION}.cdx.json")

          pre_flag=()
          if [ "$PRERELEASE" = "true" ]; then pre_flag=(--prerelease); fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; refreshing assets (draft preserved)."
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --draft \
              "${pre_flag[@]}" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi

          echo "Draft release ready: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

  # Close the supply-chain loop (#300): the `publish` job MINTS keyless SLSA
  # build-provenance + SBOM attestations, but generating them proves nothing
  # unless someone VERIFIES them. This job re-downloads the very same build
  # artifacts and runs `gh attestation verify` against each binary, so a broken,
  # missing, or repo-mismatched attestation FAILS the release run — a hard gate a
  # maintainer sees before manually publishing the draft. (The release is a
  # human-published draft, so a truly post-*publish* trigger can't be automated;
  # running immediately after the attestations are minted is the faithful
  # "post-publish" gate — see docs/dev/releasing.md.)
  #
  # LEAST PRIVILEGE: read-only. `attestations: read` lets `gh attestation verify`
  # query the attestations API; NO id-token / write / contents:write. Same
  # canonical-repo + tag-push guard as `publish`, so forks / PRs / manual dispatch
  # never run it.
  verify:
    name: Verify artifact provenance
    needs: [meta, publish]
    if: >-
      github.repository == 'ibanner56/CallersCompendium' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read     # read the attestations minted by `publish`
    steps:
      - name: Download all packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -l dist

      # Verify every released binary against BOTH attestations the `publish` job
      # minted: the SLSA build provenance (default predicate) and the CycloneDX
      # SBOM attestation (`--predicate-type https://cyclonedx.org/bom`). The glob
      # is the BINARIES only (`dist/CallersCompendium-*`) — the exact subjects the
      # attestations were bound to (never the SBOM/SHA256SUMS/<channel>.json). We
      # fail fast if the glob matches nothing (a silently empty dist would
      # otherwise let a release through unverified). `--repo` pins verification to
      # this repository so an attestation from anywhere else is rejected.
      - name: Verify SLSA build provenance + SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/CallersCompendium-*)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "::error::No dist/CallersCompendium-* artifacts found to verify."
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            echo "::group::Verifying $artifact"
            echo "-- build provenance --"
            gh attestation verify "$artifact" --repo "$REPO"
            echo "-- SBOM attestation --"
            gh attestation verify "$artifact" --repo "$REPO" \
              --predicate-type https://cyclonedx.org/bom
            echo "::endgroup::"
          done
          echo "All ${#artifacts[@]} artifact(s) passed provenance + SBOM verification."

  # Publish the channel manifest (stable.json / beta.json) to the persistent
  # `gh-pages` branch so the client's fixed URL resolves (A11c / ADR-002 §1):
  #   https://ibanner56.github.io/CallersCompendium/<channel>.json
  #
  # CROSS-CHANNEL PRESERVATION: publish_pages_manifest.sh starts from the EXISTING
  # gh-pages content and overwrites ONLY the current channel's file, so a stable
  # release never erases beta.json and vice-versa (proven offline by
  # tools/release/test_publish_pages_manifest.py). This uses the "Deploy from a
  # branch" Pages source — NOT actions/deploy-pages, which replaces the whole
  # site each deploy and would clobber the other channel.
  #
  # LEAST PRIVILEGE: contents:write ONLY (to push gh-pages) — no id-token /
  # attestations. Same canonical-repo + tag-push guard as `publish`, so forks /
  # PRs / manual dispatch can never publish the site. Enabling GitHub Pages is a
  # one-time maintainer step (docs/dev/releasing.md); until then the client 404s
  # gracefully, so shipping this before Pages is enabled is safe.
  pages:
    name: Publish update manifest to Pages
    needs: [meta, publish]
    if: >-
      github.repository == 'ibanner56/CallersCompendium' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the manifest to the gh-pages branch
    steps:
      # Provides the git remote + push credentials (persist-credentials) the
      # publisher pushes gh-pages through; no new/third-party action is needed.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download the channel manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: channel-manifest
          path: manifest

      - name: Publish the channel manifest to gh-pages
        env:
          CHANNEL: ${{ needs.meta.outputs.channel }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          bash tools/release/publish_pages_manifest.sh \
            --manifest "manifest/${CHANNEL}.json" \
            --channel "$CHANNEL" \
            --tag "$TAG"
