# Claude code review, opt-in per pull request.
#
# Copilot stays the default reviewer; nothing here runs on a PR unless someone
# with triage access applies the `review: claude` label. While the label is on
# the PR, every push to it is reviewed again, so each round lands on the new
# head the way `tools/ci/check_pr_review_gates.py review` expects. Removing the
# label stops further rounds. Requesting, reading and gating a Claude review:
# docs/dev/agents/code-review.md.
#
# Every round submits exactly one PR review (`POST /pulls/<N>/reviews`) whose
# `commit_id` is the head it reviewed, so `check_pr_review_gates.py --reviewer
# claude` reads it the same way it reads a Copilot review. The stock
# `code-review@claude-code-plugins` command is not used: it stops for good once
# Claude has commented on a PR, so pushes after the first round would never be
# re-reviewed, and it reads CLAUDE.md where this repository keeps AGENTS.md.
#
# The prompt limits findings to what the review established from the code, and
# drops the template's "Verification the author still owes" checklist: the job
# cannot run anything, and a "could not verify" note on every round reads to
# contributors like a defect. CI and the merge gate own that checklist.
#
# The action refuses to run (and the job still reports success) when this file
# differs from the default branch's copy, so a PR that edits this workflow is
# never reviewed by it. A green `claude-review` check is therefore not evidence
# that a review happened; the review entry is. CI's `Claude workflow isolation`
# job (tools/ci/check_claude_workflow_isolation.py) fails any PR that changes
# this file or claude.yml together with anything else, so only the workflow
# change itself goes unreviewed.
name: Claude Code Review

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review, reopened]

concurrency:
  # A newer push supersedes a review still running against the old head.
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Only when the label is present, not on a draft, and not on a fork (whose
    # runs receive no secrets). A `labeled` event for some other label must
    # not start a round on its own.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'review: claude') &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'review: claude')
    runs-on: ubuntu-latest
    # Writes go through the Claude GitHub App's token, not GITHUB_TOKEN.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }}. The head commit under review is
            ${{ github.event.pull_request.head.sha }}.

            Follow `.github/skills/code-review/SKILL.md`: it is this
            repository's review rubric and output format. Read `AGENTS.md`, and
            any `.github/instructions/*.instructions.md` whose `applyTo` matches
            a changed path. Get the change with
            `gh pr diff ${{ github.event.pull_request.number }}`; this checkout
            is shallow, so do not diff against local history.

            Review this head even if you, Claude, have reviewed an earlier
            commit of this PR: every push is a new round.

            Report only what you established by reading this checkout and the
            diff. This job cannot run tests, builds or scripts, and the
            contributors reading the review cannot tell "I could not check
            this" from a defect. So never report that something is unverified
            or untested, that you could not run or check something, or a
            caveat the PR description already discloses. If you cannot
            confirm a suspected defect from the code, leave it out.

            Post the result as exactly ONE pull request review:
            1. Write a JSON file with `commit_id` set to
               "${{ github.event.pull_request.head.sha }}", `event` set to
               "COMMENT", `body` set to the SKILL.md template output WITHOUT
               its "Verification the author still owes" section, and
               `comments` holding one inline comment per finding
               (`path`, `line`, `side: "RIGHT"`, `body`). Only lines that appear
               in the diff can take an inline comment; any other finding goes
               in the body only.
            2. Submit it with
               `gh api --method POST repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --input <file>`.
            3. If GitHub rejects an inline comment (HTTP 422), resubmit with
               those findings moved into the body. Never finish without a
               submitted review: a clean round is still a review, and the merge
               gate fails closed without one.
            Never use APPROVE or REQUEST_CHANGES, and post nothing else.
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api --method POST repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews:*)"
