# Standalone drift-check for the in-app User Guide's bundled docs, plus the
# render gate for the hosted guides.
#
# The in-app User Guide renders docs bundled under app/assets/docs/, mirrored
# from docs/user/ by tools/ci/sync_user_docs.py. This is the sole gate that the
# committed bundle stays in sync with docs/user/ (the single source of truth).
# The same Markdown is also pre-rendered to HTML for the Pages site by
# tools/site/render_user_docs.py (#694), so this workflow additionally proves
# the guides still render and every on-site cross-link and #anchor resolves.
#
# It lives in its own workflow — rather than the shared _checks.yml — because
# ci.yml skips entirely for Markdown-only changes (`paths-ignore: '**.md'`), and
# the guide sources under docs/user/ are Markdown; a docs-only PR that edits
# docs/user/ without regenerating app/assets/docs/, or that breaks a guide
# cross-link, would slip past a gate that only ran inside ci.yml. This
# workflow's path filters (below) trigger precisely on the files that affect
# either check — for both docs-only and code PRs — closing that gap without
# touching the main CI/release triggers.
#
# It is intentionally cheap (plain python3, no Flutter setup) and is not marked
# a required status, so it never runs on unrelated PRs and never leaves a
# required check pending.
#
# Division of labour, deliberately: the *render + link/anchor integrity* check
# lives HERE because this is the only workflow that runs on a Markdown-only PR.
# The renderer's unit suites run here AND in _checks.yml (with the other tool
# tests); pages-site.yml re-runs both as a pre-publish guard, but that workflow
# is push-to-main / dispatch only and is therefore never a PR gate.
name: Docs bundle check

on:
  push:
    branches: [main]
    paths:
      - 'docs/user/**'
      - 'app/assets/docs/**'
      - 'site/**'
      - 'tools/ci/sync_user_docs.py'
      - 'tools/site/**'
      - '.github/workflows/docs-bundle-check.yml'
  pull_request:
    paths:
      - 'docs/user/**'
      - 'app/assets/docs/**'
      - 'site/**'
      - 'tools/ci/sync_user_docs.py'
      - 'tools/site/**'
      - '.github/workflows/docs-bundle-check.yml'

# Least privilege: this check only reads the checked-out code.
permissions:
  contents: read

jobs:
  docs-bundle:
    name: User-docs bundle in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Guard in-app user-docs bundle single-source (docs/user == assets)
        run: python3 tools/ci/sync_user_docs.py --check
      # Full dry-run render of the hosted guides. This is the gate that catches
      # a Markdown-only change breaking the site: a construct the renderer can't
      # handle, a cross-link to a guide that doesn't exist, a retitled heading
      # that orphans an #anchor, two headings that collide on one anchor, or a
      # link to a repo file/folder that isn't in the tree. Errors name the
      # source .md file and the offending link.
      - name: Guard hosted user guides (render + link/anchor integrity)
        run: python3 tools/site/render_user_docs.py --check
      # The renderer's own unit tests also run in _checks.yml with the other
      # tool suites; repeated here because ci.yml skips on a Markdown-only PR.
      - name: Test the hosted-guide renderer (escaping, links, anchors)
        run: |
          python3 tools/site/test_markdown_to_html.py
          python3 tools/site/test_render_user_docs.py
