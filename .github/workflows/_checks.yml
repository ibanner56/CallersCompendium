# Reusable PR-gate checks: single-source lint + test definition.
#
# This callable workflow holds the fast `checks` job (single-source guards →
# format → analyze → core/app tests). It is invoked by the PR gate (ci.yml) and
# is designed to be reused by the future tag-triggered release workflow so the
# same check definitions gate both paths (ADR-002). It is trigger-agnostic: it
# takes no inputs and no secrets, and it deliberately does NOT contain the
# PR-only schema-guard (which needs the pull_request base ref) or the build
# matrix (the release path builds/packages its own artifacts).
#
# The Flutter version is NOT hardcoded here: it is derived from .fvmrc (the
# single source of truth, also used by FVM locally) via subosito/flutter-action's
# `flutter-version-file`. Bumping .fvmrc therefore updates every job at once.
name: Reusable checks

on:
  workflow_call:

# Least privilege: these checks only read the checked-out code. The effective
# token permissions of a called workflow are the intersection of the caller's
# permissions and this block, so both stay pinned to read-only.
permissions:
  contents: read

jobs:
  checks:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Single-source guard: the in-code kAppVersion must equal the semver part
      # of app/pubspec.yaml's version:. Runs before the (slower) Flutter setup so
      # a version drift fails fast. See tools/ci/check_app_version.py.
      - name: Guard app version single-source (kAppVersion == pubspec semver)
        run: python3 tools/ci/check_app_version.py
      - name: Test local preflight selection and availability policy
        run: python3 tools/test_preflight.py
      # Ratchet: the instruction text that is RESIDENT in every agent turn
      # (AGENTS.md plus each path-scoped .github/instructions file) must stay
      # within its byte budget. AGENTS.md grew 21.7x in three weeks — thirteen
      # commits, each individually justified, none budgeted against — and the
      # cost is paid per turn, per session. This makes an addition displace
      # something rather than append to it. The same check also runs in
      # agent-context.yml, because ci.yml skips entirely for Markdown-only
      # changes and these are all Markdown files.
      - name: Test the agent-context budget ratchet
        run: python3 tools/ci/test_check_agent_context_budget.py
      - name: Guard resident agent context (byte budget)
        run: python3 tools/ci/check_agent_context_budget.py
      # The merge-readiness gates (review freshness by reviewer identity,
      # unresolved threads with totalCount, closing-issue intent, suppressed
      # review findings) are a script rather than a procedure an agent has to
      # remember. It only runs against a live PR, so what CI can gate is its
      # logic — exercised offline against canned payloads, including the shapes
      # that made the hand-rolled versions read as PASS.
      - name: Test the merge-readiness gates
        run: python3 tools/ci/test_check_pr_review_gates.py
      # Report (not a gate): comment bytes in hand-written Dart, printed so the
      # number is in every CI log without instrumenting anything. Comments here
      # are overwhelmingly rationale rather than restatement, so a cap would
      # create pressure to delete exactly what is worth keeping — the actionable
      # signal is placement, not volume. Only its own logic is gated.
      - name: Test the comment-weight report
        run: python3 tools/ci/test_report_comment_weight.py
      - name: Report comment weight (informational)
        run: python3 tools/ci/report_comment_weight.py --top 10
      # Ratchet: no `debugPrint` may reach a release build unguarded. Debug
      # output here carries file paths, import URLs and user dance content, so
      # an unguarded call is an information leak — issue #617, cleaned up in
      # PR #647 but never enforced, so the convention held by habit alone
      # until #747. The baseline is clean (30 call sites, all guarded), so
      # this hard-fails with no allowlist. Pure-stdlib and offline, so it runs
      # before the slower Flutter setup and fails fast.
      - name: Test the unguarded-debugPrint ratchet
        run: python3 tools/ci/test_check_debug_print.py
      - name: Guard debugPrint call sites (must be kDebugMode-guarded)
        run: python3 tools/ci/check_debug_print.py
      # Ratchet: every caught, user-facing error must reach the on-device
      # diagnostic log (or explicitly say why not). Before issue #963, the
      # crash log had exactly four writers — three global handlers plus one
      # manual call site — so any error a screen caught and turned into a
      # snackbar/inline error state was invisible to it, undermining the log's
      # purpose as a field-diagnosis tool. The baseline is clean (every catch/
      # catchError/onError in app/lib was read and classified by hand), so
      # this hard-fails with no allowlist. See tools/ci/check_caught_error_logged.py.
      - name: Test the caught-error-logged ratchet
        run: python3 tools/ci/test_check_caught_error_logged.py
      - name: Guard caught errors (must log via logCaughtError or be marked silent)
        run: python3 tools/ci/check_caught_error_logged.py
      # Every raw SELECT from settings WHERE key must filter deleted_at IS NULL.
      # The invariant is load-bearing: repositories.dart performs a deliberate
      # hard DELETE and justifies it in prose by asserting that every raw read
      # filters deleted rows. A future unfiltered read would silently falsify
      # that justification. PR #885 shipped exactly this bug; issue #907.
      - name: Test the settings-marker deleted_at ratchet
        run: python3 tools/ci/test_check_settings_marker_reads.py
      - name: Guard raw settings reads (must filter deleted_at IS NULL)
        run: python3 tools/ci/check_settings_marker_reads.py
      # The schema-bump gate itself is PR-only (it needs the pull_request base
      # ref) and so lives in ci.yml, but its test suite is pure-stdlib and
      # trigger-agnostic, so it runs here — otherwise the gate's own logic would
      # be exercised by nothing, and a regression in it would show up only as a
      # schema bump that quietly stopped being gated. See
      # tools/ci/check_schema_migration.py.
      - name: Test the schema-bump gate
        run: python3 tools/ci/test_check_schema_migration.py
      # Likewise PR-only in ci.yml (it needs the base ref), so its logic is
      # exercised here. This one guards the relocation of the taxonomy and
      # schema version ledgers out of their Dart declarations and into
      # docs/design/: without it a later bump can append its entry nowhere and
      # the history stops recording, which is the one failure mode the move
      # introduced. See tools/ci/check_version_history.py.
      - name: Test the version-history gate
        run: python3 tools/ci/test_check_version_history.py
      - name: Test the CHANGELOG promotion gate
        run: python3 tools/ci/test_check_changelog_promoted.py
      - name: Test the app release-version guard
        run: python3 tools/ci/test_check_app_version.py
      - name: Test the Android release versionCode encoder
        run: python3 tools/release/test_android_version_code.py
      - name: Test the Flutter-free core guard
        run: python3 tools/ci/test_check_core_flutter_free.py
      - name: Test the core coverage-floor guard
        run: python3 tools/ci/test_check_core_coverage.py
      # Localization tooling: pure-stdlib, offline, and fast, so it runs before
      # the (slower) Flutter setup and fails fast. First self-test the assisted
      # translation tool, then gate every committed app_<locale>.arb against the
      # English template — key subset, ICU/placeholder parity (locale-specific
      # plural categories allowed), English-source freshness, @@locale agreement,
      # metadata integrity, and OWASP content safety (control/bidi-override
      # chars, dangerous URIs). A translated ARB is untrusted input (community
      # PRs / import-sharing), so a stale, parity, or safety violation fails the
      # build. See tools/ci/arb_translate.py.
      - name: Test localization tooling (arb_translate)
        run: python3 tools/ci/test_arb_translate.py
      - name: Validate translation ARBs (freshness + parity + content safety)
        run: python3 tools/ci/arb_translate.py validate --all
      # Ratchet: no user-facing string may ship untranslated in a locale we
      # publish. `validate` above enforces that a locale is a SUBSET of the
      # template, so a MISSING key passes it by design — absence is the work
      # queue `extract` reads. That is why `validate --all` returned
      # "OK ... 0 warning(s)" on a tree with 100 untranslated strings per locale
      # (issue #813): nothing measured completeness, so the backlog grew in
      # silence, 40 -> 45 -> 65 -> 77 -> 100, and only existed when someone
      # thought to run the extractor. The baseline is now clean — every locale
      # is fully translated — so this hard-fails at zero rather than ratcheting
      # a count.
      # The escape hatch (tools/ci/untranslated_allowlist.json) starts EMPTY and
      # self-cleans, so shipping a string untranslated stays possible but has to
      # be named, justified, and reviewed. Pure-stdlib and offline, so it runs
      # before the slower Flutter setup and fails fast.
      - name: Test the untranslated-string ratchet
        run: python3 tools/ci/test_check_arb_translation_coverage.py
      - name: Guard translation coverage (every locale fully translated)
        run: python3 tools/ci/check_arb_translation_coverage.py
      # Supply-chain release tooling: Python, offline, and fast (its Ed25519
      # verification needs the `cryptography` wheel, installed below), so it runs
      # before the (slower) Flutter setup and fails fast. These assert-based
      # suites cover SBOM generation, SHA256SUMS/update-manifest generation,
      # release-notes bodies, and — critically — that the Pages publish steps
      # PRESERVE detached .sig signatures. They ship in tools/release/ but were
      # previously never executed by any workflow (only the release path calls
      # the tools they cover), so a regression in this security-relevant output
      # could land unnoticed. `test_publish_pages_site.py` is here for the same
      # reason: it previously ran only in pages-site.yml, which is push-to-main
      # and workflow_dispatch only, so a PR could break the site publisher's
      # manifest-preservation contract and only fail AFTER merge. Each test
      # exits non-zero on failure (no `|| true`), so a broken suite fails this
      # PR gate.
      - name: Install Ed25519 verification dependency (for checker and its test suite)
        run: python3 -m pip install --quiet cryptography==50.0.0

      - name: Test release supply-chain tooling (SBOM / metadata / notes / pages publish)
        run: |
          python3 tools/release/test_check_beta_prerelease_history.py
          python3 tools/release/test_gen_sbom.py
          python3 tools/release/test_gen_release_metadata.py
          python3 tools/release/test_gen_release_notes.py
          python3 tools/release/test_publish_pages_manifest.py
          python3 tools/release/test_publish_pages_site.py
          python3 tools/release/test_check_pages_signature_files.py
      # Hosted user guides (docs/user -> the Pages site's /guide/ section). The
      # renderer treats its Markdown as untrusted, so its escaping and
      # href-allow-list contract is security-relevant and gets a PR gate here.
      # NOTE: the *render + link integrity* check deliberately lives in
      # docs-bundle-check.yml instead, because ci.yml (which calls this
      # workflow) has `paths-ignore: '**.md'` and so skips entirely on a
      # Markdown-only PR — exactly the PR most likely to break a guide.
      - name: Test the hosted user-guide renderer (escaping / links / anchors)
        run: |
          python3 tools/site/test_markdown_to_html.py
          python3 tools/site/test_render_user_docs.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Single source of truth for the Flutter version (see .fvmrc).
          flutter-version-file: .fvmrc
          channel: stable
          cache: true # caches the Flutter SDK and the pub cache
      # .fvmrc is the single source of truth; assert the SDK the action actually
      # resolved matches it (catches a channel override / drift). See
      # tools/ci/check_flutter_version.py.
      - name: Guard Flutter version single-source (.fvmrc == toolchain)
        run: python3 tools/ci/check_flutter_version.py
      - run: flutter pub get --enforce-lockfile
      # package:sqlite3's build hook downloads a pre-compiled SQLite library
      # from a GitHub release during native-asset resolution, so every job that
      # runs a test has that network fetch on its critical path — and it fails
      # BEFORE any test executes (the hook runs during build-asset resolution),
      # on THIS gating check, so a transient CDN blip reds the merge path rather
      # than a single platform build. Issue #939: seven such failures in ~7h,
      # every one cleared by a bare re-run. subosito's `cache: true` above does
      # NOT cover this: it caches the Flutter SDK and the pub cache, but the .so
      # is fetched by the build hook and written OUTSIDE the pub cache, under
      # .dart_tool/hooks_runner/shared/sqlite3/. The hook reuses that artifact
      # in place when it is present (it re-verifies the file's SHA-256 and only
      # re-downloads on a mismatch), so caching that directory turns the fetch
      # into an at-most-once-per-version event and lets a cache hit satisfy the
      # build even when the CDN is down. Remove this and the flake in #939
      # returns. The version is resolved into the key below rather than hashing
      # the whole lockfile so an unrelated dependency bump does not needlessly
      # evict the artifact.
      - name: Resolve the pinned sqlite3 version (cache key input)
        id: sqlite3
        # The prebuilt is per-version, so the cache MUST invalidate on a bump.
        # The root pubspec.lock is the only real lockfile (pub workspace; see
        # .gitignore) and `flutter pub get --enforce-lockfile` above pins it, so
        # read the version from there. The `^  sqlite3:` anchor (2-space indent,
        # trailing colon) deliberately does not match `sqlite3_flutter_libs:`.
        # Fail loudly rather than silently cache under an empty, colliding key.
        run: |
          version="$(awk '/^  sqlite3:/{f=1} f&&/^    version:/{gsub(/[" ]/,"",$2); print $2; exit}' pubspec.lock)"
          if [ -z "$version" ]; then
            echo "::error::could not resolve the sqlite3 version from pubspec.lock"
            exit 1
          fi
          echo "Resolved sqlite3 version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache the sqlite3 prebuilt native library
        id: sqlite3_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared/sqlite3
          # Keyed on the sqlite3 version (a bump must re-fetch the new binary)
          # plus runner.os/arch: the artifact is platform-specific, and this
          # reusable workflow is written to be reused on other runners (see the
          # header and ADR-002), so a Linux .so must never be restored onto a
          # macOS/Windows runner. This job runs only on ubuntu-latest today, so
          # os/arch are constant here — they are insurance against that reuse,
          # and cost nothing. No restore-keys: a prefix match would restore a
          # different version's binary, which the hook would reject on its hash
          # check and re-download anyway, so only an exact match is worth having.
          key: sqlite3-prebuilt-${{ runner.os }}-${{ runner.arch }}-${{ steps.sqlite3.outputs.version }}
      - run: dart format --output=none --set-exit-if-changed .
      # --fatal-infos: the analysis_options here are deliberately strict
      # (strict-casts/strict-inference/strict-raw-types + error escalations), but
      # a bare `flutter analyze` still lets analyzer *infos* through. Treat infos
      # as build failures so the CI gate matches the repo's own standard and can
      # never silently regress below it.
      - run: flutter analyze --fatal-infos
      # app/lib/l10n's AppLocalizations sources are GENERATED from the ARB files
      # by `flutter gen-l10n` and committed. No other gate in this job compares
      # the committed output against a fresh regeneration, and the generated Dart
      # is deliberately authored to stay format- and analyze-clean (see
      # app/l10n.yaml), so an ARB edit committed WITHOUT re-running gen-l10n
      # sails past format, analyze, the arb_translate gates and the coverage
      # check: each of those validates an INPUT to gen-l10n, none its committed
      # OUTPUT. That gap shipped real work as English to five locales in #924
      # (fixed in #929) and is issue #930. `flutter pub get` above even
      # regenerates lib/l10n into the working tree, so the drift is present but
      # invisible until something diffs it. Regenerate and fail on any
      # difference. NOTE: a pass means the committed Dart matches TODAY'S
      # generator for the current ARBs, NOT that the strings are translated
      # correctly (that is the arb_translate/coverage gates' job). Remove this
      # and ARB->generated drift becomes undetectable again.
      - name: Guard committed localizations against ARB drift (#930)
        run: python3 tools/ci/check_l10n_drift.py
      # ADR-001: the domain core must stay free of Flutter. Resolution/dependency
      # based guard (replaces a brittle grep that false-positived on comments):
      #   1. no Flutter package is reachable in compendium_core's resolved
      #      dependency graph (`dart pub deps --json`) — this is the authoritative
      #      check and catches a real import or transitive dependency, and
      #   2. a comment-safe source scan of lib/test/benchmark for an actual
      #      import/export directive targeting package:flutter* (comments are
      #      stripped first; the directive regex requires a full quoted URI and a
      #      trailing semicolon so it won't fire on a string-literal line).
      - name: Guard compendium_core against Flutter (ADR-001)
        run: python3 tools/ci/check_core_flutter_free.py
      - name: Guard figure fixtures against the taxonomy (#747)
        working-directory: packages/compendium_core
        # Ratchet: every `Figure(...)` in either test suite must be valid under
        # contraTaxonomy, routed through `testFigure` (which validates at run
        # time, for fixtures built from variables), or marked
        # `// invalid-fixture: <reason>`. Rendering SUBSTITUTES rather than
        # validates, so an invalid param renders literally and every test still
        # passes — which is how seven `meanwhile` fixtures drifted unnoticed for
        # days when #697 split `orbit` into a first-class move (fixed in #745).
        # Also checks the marker in the other direction (#791): one that
        # introduces no fixture is a stale claim the next fixture written under
        # it would silently inherit, so it fails here rather than lying quietly.
        # Runs before the core test suite so a drifted fixture is reported as a
        # fixture problem rather than as whatever downstream assertion it breaks.
        run: dart run tool/check_fixture_validity.dart
      - name: Test compendium_core (with coverage)
        run: python3 tools/ci/run_core_tests_with_coverage.py
      - name: Enforce compendium_core coverage floor
        run: python3 tools/ci/check_core_coverage.py
      - name: Benchmark compendium_core search (20k dances)
        working-directory: packages/compendium_core
        run: dart run benchmark/search_benchmark.dart
      - name: Test app
        working-directory: app
        run: flutter test
      # Save the prebuilt only on a miss, and only once the build hook has
      # actually produced the library. The guard matters: a fetch failure — the
      # very flake #939 is about — leaves an empty download directory behind, and
      # without the hashFiles() check the post step would cache that emptiness
      # under this key. A later run would then get a cache HIT on nothing,
      # re-download, and (being a hit) never re-save, so one unlucky first fetch
      # would silently disable this cache until the pinned version next changes.
      # !cancelled() (not success()) so a good download is still cached even if
      # an unrelated later step failed, letting the re-run drop the fetch.
      - name: Save the sqlite3 prebuilt native library
        if: ${{ !cancelled() && steps.sqlite3_cache.outputs.cache-hit != 'true' && hashFiles('.dart_tool/hooks_runner/shared/sqlite3/build/**/libsqlite3*') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared/sqlite3
          key: sqlite3-prebuilt-${{ runner.os }}-${{ runner.arch }}-${{ steps.sqlite3.outputs.version }}
