# Pages site: publish the static landing page in `site/` — plus the user guides
# rendered from `docs/user/` — to the `gh-pages` branch that also hosts the
# in-app update manifests (https://ibanner56.github.io/CallersCompendium/).
#
# WHY a branch push (not actions/deploy-pages): the GitHub-Actions Pages flow
# replaces the WHOLE site each deploy, which would clobber `beta.json` /
# `stable.json`. tools/release/publish_pages_site.sh instead starts from the
# existing gh-pages content and rewrites ONLY the site files, preserving the
# manifests — the mirror image of the release pipeline's manifest publisher, so
# the two coexist. Keep the Pages source on "Deploy from a branch -> gh-pages".
# The preserve/prune/no-op contract is covered offline by
# tools/release/test_publish_pages_site.py.
#
# WHY a build step: `.nojekyll` (needed so the JSON manifests serve verbatim)
# also means Jekyll will not render Markdown for us, so
# tools/site/render_user_docs.py pre-renders `docs/user/*.md` into `guide/` and
# stages a complete site under `build/site`. The publisher is handed that
# directory and needs no knowledge of the guides (issue #694).
name: Pages site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/user/**
      - tools/site/**
      - tools/ci/sync_user_docs.py
      - tools/release/publish_pages_site.sh
      - .github/workflows/pages-site.yml
  # Manual re-publish (e.g. after a release, to refresh editorial copy).
  workflow_dispatch: {}

# Least privilege: only the write scope needed to push the gh-pages branch.
permissions:
  contents: write

# Serialize; don't cancel a half-finished publish.
concurrency:
  group: pages-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish landing page to gh-pages
    runs-on: ubuntu-latest
    # Canonical repo only, and never from a fork PR — matches the release
    # pipeline's guard so only trusted pushes can publish the site.
    if: github.repository == 'ibanner56/CallersCompendium'
    steps:
      # Full history so the publisher can add a gh-pages worktree; the
      # persist-credentials default provides the push token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Guard: the offline preservation/prune/no-op contract must hold, and the
      # guide renderer's escaping / link-sanitisation contract with it. This is
      # defence in depth only — the PR-time gates are _checks.yml (renderer +
      # publisher unit tests) and docs-bundle-check.yml (render + link
      # integrity), because this workflow never runs on a pull request.
      - name: Test the publisher and the guide renderer (offline)
        run: |
          python3 tools/release/test_publish_pages_site.py
          python3 tools/site/test_markdown_to_html.py
          python3 tools/site/test_render_user_docs.py

      # Stage the complete site (site/ + guides rendered from docs/user/).
      # Fails on a broken on-site link, so a bad cross-reference never ships.
      - name: Render the user guides into the site
        run: python3 tools/site/render_user_docs.py --out build/site

      - name: Publish the landing page and guides to gh-pages
        env:
          SOURCE_REF: ${{ github.sha }}
        run: bash tools/release/publish_pages_site.sh --site build/site

      # Defence in depth (#759): assert the published gh-pages state immediately
      # after a site deploy, catching a missing *.json.sig synchronously within
      # this job. The primary ongoing gate is pages-sig-gate.yml (daily schedule
      # + workflow_dispatch — see that workflow for why no push trigger).
      - name: Assert gh-pages signature invariant
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin gh-pages
          tmpdir="$(mktemp -d)"
          git archive FETCH_HEAD | tar -x -C "$tmpdir"
          python3 tools/release/check_pages_signature_files.py "$tmpdir"
