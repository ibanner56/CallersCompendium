# CI: lint + test on every push/PR, plus a build matrix covering all five
# target platforms.
#
# The Flutter version is NOT hardcoded here: it is derived from .fvmrc (the
# single source of truth, also used by FVM locally) via subosito/flutter-action's
# `flutter-version-file`. Bumping .fvmrc therefore updates every job at once.
name: CI

# Docs-only changes (Markdown) don't affect the build/test/analyze pipeline, so
# skip CI when a push or PR touches nothing but *.md files.
#
# NOTE: paths-ignore prevents these workflows from starting at all for a
# Markdown-only change, so they never report a status. As of this writing the
# `main` branch ruleset does NOT mark these CI checks as required, so a
# Markdown-only PR won't get stuck waiting on a status that never arrives.
# Branch protection lives outside this file and can change, though: if CI is
# ever made a required status check, revisit this, because a skipped required
# check stays pending forever. The fix would be to always start the workflow
# and gate the heavy jobs internally (e.g. a dorny/paths-filter step guarding
# conditional jobs, plus a final job that always reports the required check
# name) rather than skipping the run via paths-ignore.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

# Cancel superseded in-flight runs for the same PR (or ref, for pushes) so a
# new push doesn't leave stale, redundant builds burning runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the checked-out code.
permissions:
  contents: read

jobs:
  checks:
    # Delegate to the reusable checks workflow so the same lint/test/guard
    # definitions single-source both this PR gate and the future release
    # path (ADR-002). The event triggers, paths-ignore, and concurrency stay
    # here on the caller; the PR-only schema-guard and the build matrix
    # intentionally remain below (see notes on each).
    uses: ./.github/workflows/_checks.yml

  build:
    name: Build (${{ matrix.target }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
            build_args: linux --release
          - target: android
            os: ubuntu-latest
            build_args: apk --debug
          - target: macos
            os: macos-latest
            build_args: macos --release
          - target: ios
            os: macos-latest
            build_args: ios --release --no-codesign
          - target: windows
            os: windows-latest
            build_args: windows --release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle # caches ~/.gradle for the Android build
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build
        working-directory: app
        run: flutter build ${{ matrix.build_args }}

  # PR-only single-source gate: a schemaVersion bump in compendium_core's
  # database.dart must ship a migration test/fixture in the same PR. Needs full
  # history to diff against the PR base. See tools/ci/check_schema_migration.py.
  schema-guard:
    name: Schema migration gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so we can diff against the PR base
      - name: Guard schemaVersion bumps ship a migration test/fixture
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci/check_schema_migration.py "$BASE_SHA"
