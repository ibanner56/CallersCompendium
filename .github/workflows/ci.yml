# CI: lint + test on every push/PR, plus a build matrix covering all five
# target platforms.
#
# The Flutter version is NOT hardcoded here: it is derived from .fvmrc (the
# single source of truth, also used by FVM locally) via subosito/flutter-action's
# `flutter-version-file`. Bumping .fvmrc therefore updates every job at once.
name: CI

# Markdown-only changes do not need the costly Flutter checks or platform
# builds. Pull requests still start this workflow, though: `Merge gate` is a
# required status and must report for every PR. `classify` skips the expensive
# jobs only after comparing the PR base and head; `Merge gate` then verifies
# that the skipped result was expected. Pushes retain the path filter because
# they do not provide the required PR status.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:

# Cancel superseded in-flight runs for the same PR (or ref, for pushes) so a
# new push doesn't leave stale, redundant builds burning runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the checked-out code.
permissions:
  contents: read

jobs:
  # Match the former paths-ignore rule exactly, but do it inside a PR workflow
  # so the required final gate always exists. --no-renames makes a code-to-Markdown
  # rename count as code-changing rather than hiding the removed code path.
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != 'pull_request' ]; then
            # The retained push path filter already excludes Markdown-only pushes.
            echo 'code_changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo '::error::Pull request base or head SHA is unavailable.'
            exit 1
          fi
          python3 - "$BASE_SHA" "$HEAD_SHA" <<'PY'
          import os
          import subprocess
          import sys

          base, head = sys.argv[1:]
          result = subprocess.run(
              ['git', 'diff', '--no-renames', '--name-only', '-z', base, head],
              capture_output=True,
              check=False,
          )
          if result.returncode:
              detail = result.stderr.decode(errors='replace').strip()
              print(f'::error::Unable to determine pull request changes: {detail}')
              raise SystemExit(1)

          paths = tuple(path for path in result.stdout.split(b'\0') if path)
          if not paths:
              print(
                  '::error::Pull request has no changed paths; refusing to '
                  'classify it as Markdown-only.'
              )
              raise SystemExit(1)

          code_changed = any(not path.endswith(b'.md') for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'code_changed={str(code_changed).lower()}\n')
          PY

  checks:
    # Delegate to the reusable checks workflow so the same lint/test/guard
    # definitions single-source both this PR gate and the future release
    # path (ADR-002). The event triggers, push path filter, and concurrency
    # stay here on the caller; the PR-only schema-guard and the build matrix
    # intentionally remain below (see notes on each).
    needs: classify
    if: needs.classify.outputs.code_changed == 'true'
    uses: ./.github/workflows/_checks.yml

  build:
    name: Build (${{ matrix.target }})
    needs: [classify, checks]
    if: >-
      needs.classify.outputs.code_changed == 'true' &&
      needs.checks.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
            build_args: linux --release
          - target: android
            os: ubuntu-latest
            build_args: apk --debug
          - target: macos
            os: macos-latest
            build_args: macos --release
          - target: ios
            os: macos-latest
            build_args: ios --release --no-codesign
          - target: windows
            os: windows-latest
            build_args: windows --release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle # caches ~/.gradle for the Android build
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build
        working-directory: app
        run: flutter build ${{ matrix.build_args }}

  # PR-only single-source gate: a schemaVersion bump in compendium_core's
  # database.dart must ship a migration test/fixture in the same PR. Needs full
  # history to diff against the PR base. See tools/ci/check_schema_migration.py.
  schema-guard:
    name: Schema migration gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so we can diff against the PR base
      - name: Guard schemaVersion bumps ship a migration test/fixture
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci/check_schema_migration.py "$BASE_SHA"
      # Same PR-only shape, same base ref, one more thing a bump must ship: the
      # per-version entry in the design doc that now holds the log. The
      # taxonomy and schema ledgers used to sit as doc comments on their own
      # declarations, 40.7 KiB and 19.4 KiB of history that every reader of
      # those files paid for to reach a one-line constant; moving them to
      # docs/design/ is only safe if a later bump cannot quietly append its
      # entry nowhere. See tools/ci/check_version_history.py.
      - name: Guard version bumps append their design-doc history entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci/check_version_history.py "$BASE_SHA"

  # This is the sole required status for main. It runs even when a dependency
  # fails or is skipped, so a cancelled or missing heavy job cannot look green.
  merge-gate:
    name: Merge gate
    needs: [classify, checks, build, schema-guard]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required job results
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          CODE_CHANGED: ${{ needs.classify.outputs.code_changed }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SCHEMA_GUARD_RESULT: ${{ needs.schema-guard.result }}
        run: |
          set -u
          failed=0

          require_success() {
            if [ "$2" != 'success' ]; then
              echo "::error::$1 finished with '$2'; expected success."
              failed=1
            fi
          }

          require_skipped() {
            if [ "$2" != 'skipped' ]; then
              echo "::error::$1 finished with '$2'; expected skipped."
              failed=1
            fi
          }

          require_success 'Classify changes' "$CLASSIFY_RESULT"
          require_success 'Schema migration gate' "$SCHEMA_GUARD_RESULT"

          case "$CODE_CHANGED" in
            true)
              require_success 'Format, analyze, test' "$CHECKS_RESULT"
              require_success 'Platform builds' "$BUILD_RESULT"
              ;;
            false)
              require_skipped 'Format, analyze, test' "$CHECKS_RESULT"
              require_skipped 'Platform builds' "$BUILD_RESULT"
              ;;
            *)
              echo "::error::Classify changes produced invalid code_changed output '$CODE_CHANGED'."
              failed=1
              ;;
          esac

          exit "$failed"
