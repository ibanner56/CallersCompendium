# CI: lint + test on every push/PR, plus a build matrix covering all five
# target platforms.
#
# The Flutter version is NOT hardcoded here: it is derived from .fvmrc (the
# single source of truth, also used by FVM locally) via subosito/flutter-action's
# `flutter-version-file`. Bumping .fvmrc therefore updates every job at once.
name: CI

# Markdown-only changes do not need the costly Flutter checks or platform
# builds. Pull requests still start this workflow, though: `Merge gate` is a
# required status and must report for every PR. For a synchronized PR update,
# `classify` checks only the new range when the previous head has a successful
# Merge gate; otherwise it conservatively checks the whole PR diff. Pushes retain
# the path filter because they do not provide the required PR status.
#
# `edited` is deliberately not among the PR types. It arrived with the Device
# Sync tracking gate (#1138), whose job read the PR body and so had to re-run
# when the body changed; that job was removed in #1338 when the tracking units
# completed. Without it, editing a PR description no longer starts a second run
# whose concurrency group cancels the first — which left a `Merge gate` failure
# on the cancelled suite and forced the next run to re-classify the whole PR
# diff rather than just the new range.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    types: [opened, reopened, synchronize]

# Cancel superseded in-flight runs for the same PR (or ref, for pushes) so a
# new push doesn't leave stale, redundant builds burning runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the checked-out code.
permissions:
  contents: read
  checks: read

jobs:
  # Keep the required final gate present for every PR, while selecting work from
  # either the full PR diff or a validated incremental update. --no-renames
  # makes a code-to-Markdown rename count as code-changing rather than hiding
  # the removed code path.
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      validation_changed: ${{ steps.classify.outputs.validation_changed }}
      core_tests_changed: ${{ steps.classify.outputs.core_tests_changed }}
      app_tests_changed: ${{ steps.classify.outputs.app_tests_changed }}
      server_tests_changed: ${{ steps.classify.outputs.server_tests_changed }}
      builds_changed: ${{ steps.classify.outputs.builds_changed }}
      apple_native_changed: ${{ steps.classify.outputs.apple_native_changed }}
      docs_bundle_changed: ${{ steps.classify.outputs.docs_bundle_changed }}
      changelog_changed: ${{ steps.classify.outputs.changelog_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != 'pull_request' ]; then
            # The retained push path filter already excludes Markdown-only pushes.
            {
              echo 'validation_changed=true'
              echo 'core_tests_changed=true'
              echo 'app_tests_changed=true'
              echo 'server_tests_changed=true'
              echo 'builds_changed=true'
              echo 'apple_native_changed=true'
              echo 'docs_bundle_changed=true'
              echo 'changelog_changed=true'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo '::error::Pull request base or head SHA is unavailable.'
            exit 1
          fi
          # Decision logic lives in tools/ci/classify_changes.py so the
          # path-to-guard routing can be exercised without a real Actions run.
          # Its unit test, tools/ci/test_classify_changes.py, runs in
          # _checks.yml's validate job and in tools/preflight.py -- a
          # classifier edit is never Markdown-only, so validate always runs
          # for one. See classify_changes.py for the path sets.
          python3 tools/ci/classify_changes.py "$BASE_SHA" "$HEAD_SHA" "$BEFORE_SHA"

  checks:
    # Delegate to the reusable checks workflow so the same validation/test/guard
    # definitions single-source both this PR gate and the future release
    # path (ADR-002). The event triggers, push path filter, and concurrency
    # stay here on the caller; the PR-only schema-guard and the build matrix
    # intentionally remain below (see notes on each).
    needs: classify
    if: needs.classify.outputs.validation_changed == 'true'
    uses: ./.github/workflows/_checks.yml
    with:
      run_core_tests: ${{ needs.classify.outputs.core_tests_changed == 'true' }}
      run_app_tests: ${{ needs.classify.outputs.app_tests_changed == 'true' }}
      run_server_tests: ${{ needs.classify.outputs.server_tests_changed == 'true' }}

  # Reuses docs-bundle-check.yml's own checks (that workflow is not a required
  # status, so its own failure can't block a merge). This job feeds the same
  # result into merge-gate below for PRs that touch docs_bundle_changed paths.
  # docs-bundle-check.yml itself is left running unchanged as a push-to-main
  # safety net; duplicated execution on a relevant PR is accepted.
  docs-bundle-gate:
    name: User-docs bundle in sync
    needs: classify
    if: needs.classify.outputs.docs_bundle_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the in-app user-docs sync checker
        run: python3 tools/ci/test_sync_user_docs.py
      - name: Guard in-app user-docs bundle single-source (docs/user == assets)
        run: python3 tools/ci/sync_user_docs.py --check
      - name: Guard hosted user guides (render + link/anchor integrity)
        run: python3 tools/site/render_user_docs.py --check
      - name: Test the hosted-guide renderer (escaping, links, anchors)
        run: |
          python3 tools/site/test_markdown_to_html.py
          python3 tools/site/test_render_user_docs.py
          python3 tools/site/test_privacy_policy.py

  # Same shape as docs-bundle-gate above, for changelog-structure.yml.
  changelog-structure-gate:
    name: CHANGELOG validation
    needs: classify
    if: needs.classify.outputs.changelog_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the changelog structure gate
        run: python3 tools/ci/test_check_changelog_structure.py
      - name: Test the changelog fragment compiler
        run: python3 tools/release/test_compile_changelog_fragments.py
      - name: Validate pending changelog fragments
        run: python3 tools/release/compile_changelog_fragments.py --check
      - name: Guard CHANGELOG structure (version order, no repeated category)
        run: python3 tools/ci/check_changelog_structure.py

  build:
    name: Build (${{ matrix.target }})
    needs: [classify, checks]
    if: >-
      needs.classify.outputs.builds_changed == 'true' &&
      needs.checks.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built inside the same ubuntu:22.04 container as release.yml's Linux
          # leg, so main's push build proves the release toolchain still builds
          # before a tag does. The container's glibc (2.35) is the documented
          # floor; the runner it is scheduled on does not affect it.
          # tools/ci/check_linux_build_runner.py enforces both workflows.
          - target: linux
            os: ubuntu-latest
            container: ubuntu:22.04@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401
            build_args: linux --release
          - target: android
            os: ubuntu-latest
            build_args: apk --debug
          - target: macos
            os: macos-latest
            build_args: macos --release
          - target: ios
            os: macos-latest
            build_args: ios --release --no-codesign
          - target: windows
            os: windows-latest
            build_args: windows --release
    runs-on: ${{ matrix.os }}
    # Only the Linux leg sets matrix.container. For the others it evaluates to
    # an empty string, which the runner treats as no container at all.
    container: ${{ matrix.container }}
    steps:
      # The container starts with only the base system and runs as root (no
      # sudo). This runs before checkout because actions/checkout needs git
      # 2.18 or later, or it downloads a tarball with no .git instead.
      # Keep the package list the same as release.yml's.
      - name: Install Linux build dependencies (ubuntu:22.04 container)
        if: matrix.target == 'linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # git, curl, jq, unzip, xz-utils, zip: actions/checkout,
          #   subosito/flutter-action and the Flutter tool.
          # clang, cmake, ninja-build, pkg-config, libgtk-3-dev: Flutter's
          #   Linux toolchain.
          # libstdc++-12-dev: clang builds against the newest GCC installation
          #   it finds. On its own it pulls in GCC 11; this makes it GCC 12,
          #   as on the runner images these legs used to build on, so the C++
          #   runtime the binaries need is unchanged.
          # openjdk-17-jdk-headless: the jni plugin builds libdartjni.so only
          #   when CMake finds a JDK. The runner images ship one with
          #   JAVA_HOME set, so without both the bundle would silently lose a
          #   file it has always had. CMake does not look in the versioned
          #   OpenJDK directory on its own, hence JAVA_HOME below.
          # binutils, python3: tools/ci/check_linux_glibc_floor.py.
          apt-get install -y --no-install-recommends \
            ca-certificates git curl jq unzip xz-utils zip \
            clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev \
            openjdk-17-jdk-headless binutils python3
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle # caches ~/.gradle for the Android build
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      # Two git repositories here belong to a user other than the
      # container's root: the workspace (created by the runner's user) and
      # the Flutter SDK (extracted by root, keeping the archive's own uid).
      # git refuses to work in either ("detected dubious ownership"), and the
      # flutter tool runs git in its SDK on every invocation.
      - name: Trust the workspace and Flutter SDK repositories (container)
        if: matrix.target == 'linux'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$FLUTTER_ROOT"
      - run: flutter pub get --enforce-lockfile
      - name: Build
        working-directory: app
        run: flutter build ${{ matrix.build_args }}
      # The binaries need at most the glibc of the container that built them;
      # this reads what they actually need and fails above the floor.
      - name: Check the Linux bundle's glibc floor
        if: matrix.target == 'linux'
        run: python3 tools/ci/check_linux_glibc_floor.py app/build/linux/x64/release/bundle
      # Native Swift tests (post-audit finding platform-7). `flutter build`
      # never compiles the RunnerTests targets, so these steps are the only
      # place the XCTest suites in app/ios/RunnerTests and
      # app/macos/RunnerTests are built and run. On a PR they run only when
      # classify's apple_native_changed is true: a path under app/ios/ or
      # app/macos/, or .fvmrc, in a diff that is not Markdown-only (an
      # all-Markdown diff skips validation and so the whole build job). On a
      # push to main classify sets every output true, so they run on every
      # push that gets past the '**.md' paths-ignore filter.
      # tools/ci/check_apple_native_tests.py guards their shape.
      #
      # `--config-only --debug` writes the Debug Generated.xcconfig and the
      # Swift package / plugin wiring that xcodebuild needs, without a second
      # full Flutter build; the Debug configuration is what the Runner
      # scheme's TestAction uses. Xcode is the runner image's default, the
      # same one release.yml builds the shipped app with.
      - name: Test native Swift code (iOS RunnerTests)
        if: >-
          matrix.target == 'ios' &&
          needs.classify.outputs.apple_native_changed == 'true'
        working-directory: app
        timeout-minutes: 30
        run: |
          # GitHub runs an unspecified shell as `bash -e`, without pipefail.
          set -o pipefail
          xcodebuild -version
          flutter build ios --config-only --debug --simulator
          cd ios
          # Ask xcodebuild which iOS simulators this scheme can actually run
          # on (so the runtime is one the selected Xcode's SDK supports), then
          # take an iPhone on the newest iOS. A hard-coded device name breaks
          # whenever the runner image changes its simulator set.
          udid="$(xcodebuild -showdestinations -workspace Runner.xcworkspace -scheme Runner \
            | python3 -c '
          import re, sys
          best = None
          for line in sys.stdin:
              if "Ineligible destinations" in line:
                  break
              m = re.search(r"platform:iOS Simulator,.*?id:([0-9A-Fa-f-]{36}),.*?OS:([0-9.]+), name:(iPhone[^}]*?)\s*\}", line)
              if m:
                  key = (tuple(int(p) for p in m.group(2).split(".")), m.group(3))
                  if best is None or key > best[0]:
                      best = (key, m.group(1))
          if best is None:
              sys.exit("no iPhone simulator destination is available for the Runner scheme")
          print("Testing on %s (iOS %s)" % (best[0][1], ".".join(map(str, best[0][0]))), file=sys.stderr)
          print(best[1])
          ')"
          # Simulator builds need no signing; CODE_SIGNING_ALLOWED=NO keeps
          # Xcode from looking for a development team the runner does not have.
          # set +e so a failing run still reaches the summary below; its
          # status is taken from PIPESTATUS, not from tee.
          set +e
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "id=$udid" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"
          status="${PIPESTATUS[0]}"
          set -e
          # Report the count whatever the outcome, then fail on xcodebuild's
          # own status, or if it "succeeded" without running a test (a
          # testable unticked in the scheme, say). Xcode 26 prints
          # "Test case '...' passed"; older Xcode "Test Case".
          log="$RUNNER_TEMP/xcodebuild-test.log"
          passed="$(grep -cE "^[[:space:]]*Test [Cc]ase '.*' passed" "$log" || true)"
          failed="$(grep -cE "^[[:space:]]*Test [Cc]ase '.*' failed" "$log" || true)"
          echo "iOS RunnerTests: $passed passed, $failed failed" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::xcodebuild test exited with status $status."
            exit "$status"
          fi
          if [ "$passed" -eq 0 ]; then
            echo "::error::xcodebuild test reported no passing iOS RunnerTests."
            exit 1
          fi
      - name: Test native Swift code (macOS RunnerTests)
        if: >-
          matrix.target == 'macos' &&
          needs.classify.outputs.apple_native_changed == 'true'
        working-directory: app
        timeout-minutes: 30
        run: |
          # GitHub runs an unspecified shell as `bash -e`, without pipefail.
          set -o pipefail
          xcodebuild -version
          flutter build macos --config-only --debug
          cd macos
          # The project already signs ad hoc (CODE_SIGN_IDENTITY "-", no
          # team), which is what a hosted test bundle needs to load into the
          # app on Apple silicon; no override is required.
          # set +e so a failing run still reaches the summary below; its
          # status is taken from PIPESTATUS, not from tee.
          set +e
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination 'platform=macOS' \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"
          status="${PIPESTATUS[0]}"
          set -e
          # Report the count whatever the outcome, then fail on xcodebuild's
          # own status, or if it "succeeded" without running a test (a
          # testable unticked in the scheme, say). Xcode 26 prints
          # "Test case '...' passed"; older Xcode "Test Case".
          log="$RUNNER_TEMP/xcodebuild-test.log"
          passed="$(grep -cE "^[[:space:]]*Test [Cc]ase '.*' passed" "$log" || true)"
          failed="$(grep -cE "^[[:space:]]*Test [Cc]ase '.*' failed" "$log" || true)"
          echo "macOS RunnerTests: $passed passed, $failed failed" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::xcodebuild test exited with status $status."
            exit "$status"
          fi
          if [ "$passed" -eq 0 ]; then
            echo "::error::xcodebuild test reported no passing macOS RunnerTests."
            exit 1
          fi
      # The Kotlin JVM unit tests in app/android/app/src/test (the incoming
      # share size cap, copy cleanup and cold-start vs warm routing). Neither
      # `flutter build` nor `flutter test` compiles them. It runs after the
      # build because that is what writes the Gradle wrapper (gitignored) and
      # local.properties. tools/ci/check_android_unit_tests.py guards this step.
      - name: Android unit tests
        if: matrix.target == 'android'
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest

  # PR-only single-source gate: a schemaVersion bump in compendium_core's
  # database.dart must ship a migration test/fixture in the same PR. Needs full
  # history to diff against the PR base. See tools/ci/check_schema_migration.py.
  schema-guard:
    name: Schema migration gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so we can diff against the PR base
      - name: Guard schemaVersion bumps ship a migration test/fixture
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci/check_schema_migration.py "$BASE_SHA"
      # Same PR-only shape, same base ref, one more thing a bump must ship: the
      # per-version entry in the design doc that now holds the log. The
      # taxonomy and schema ledgers used to sit as doc comments on their own
      # declarations, 40.7 KiB and 19.4 KiB of history that every reader of
      # those files paid for to reach a one-line constant; moving them to
      # docs/design/ is only safe if a later bump cannot quietly append its
      # entry nowhere. See tools/ci/check_version_history.py.
      - name: Guard version bumps append their design-doc history entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci/check_version_history.py "$BASE_SHA"

  # This is the sole required status for main. It runs even when a dependency
  # fails or is skipped, so a cancelled or missing heavy job cannot look green.
  merge-gate:
    name: Merge gate
    needs: [classify, checks, build, schema-guard, docs-bundle-gate, changelog-structure-gate]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required job results
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          VALIDATION_CHANGED: ${{ needs.classify.outputs.validation_changed }}
          BUILDS_CHANGED: ${{ needs.classify.outputs.builds_changed }}
          DOCS_BUNDLE_CHANGED: ${{ needs.classify.outputs.docs_bundle_changed }}
          CHANGELOG_CHANGED: ${{ needs.classify.outputs.changelog_changed }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SCHEMA_GUARD_RESULT: ${{ needs.schema-guard.result }}
          DOCS_BUNDLE_GATE_RESULT: ${{ needs.docs-bundle-gate.result }}
          CHANGELOG_GATE_RESULT: ${{ needs.changelog-structure-gate.result }}
        run: |
          set -u
          failed=0

          require_success() {
            if [ "$2" != 'success' ]; then
              echo "::error::$1 finished with '$2'; expected success."
              failed=1
            fi
          }

          require_skipped() {
            if [ "$2" != 'skipped' ]; then
              echo "::error::$1 finished with '$2'; expected skipped."
              failed=1
            fi
          }

          require_success 'Classify changes' "$CLASSIFY_RESULT"
          require_success 'Schema migration gate' "$SCHEMA_GUARD_RESULT"

          case "$VALIDATION_CHANGED" in
            true)
              require_success 'Validation checks' "$CHECKS_RESULT"
              ;;
            false)
              require_skipped 'Validation checks' "$CHECKS_RESULT"
              ;;
            *)
              echo "::error::Classify changes produced invalid validation_changed output '$VALIDATION_CHANGED'."
              failed=1
              ;;
          esac

          case "$BUILDS_CHANGED" in
            true) require_success 'Platform builds' "$BUILD_RESULT" ;;
            false) require_skipped 'Platform builds' "$BUILD_RESULT" ;;
            *)
              echo "::error::Classify changes produced invalid builds_changed output '$BUILDS_CHANGED'."
              failed=1
              ;;
          esac

          case "$DOCS_BUNDLE_CHANGED" in
            true) require_success 'User-docs bundle in sync' "$DOCS_BUNDLE_GATE_RESULT" ;;
            false) require_skipped 'User-docs bundle in sync' "$DOCS_BUNDLE_GATE_RESULT" ;;
            *)
              echo "::error::Classify changes produced invalid docs_bundle_changed output '$DOCS_BUNDLE_CHANGED'."
              failed=1
              ;;
          esac

          case "$CHANGELOG_CHANGED" in
            true) require_success 'CHANGELOG validation' "$CHANGELOG_GATE_RESULT" ;;
            false) require_skipped 'CHANGELOG validation' "$CHANGELOG_GATE_RESULT" ;;
            *)
              echo "::error::Classify changes produced invalid changelog_changed output '$CHANGELOG_CHANGED'."
              failed=1
              ;;
          esac

          exit "$failed"
