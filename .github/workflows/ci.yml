# CI: lint + test on every push/PR, plus a build matrix covering all five
# target platforms.
#
# The Flutter version is NOT hardcoded here: it is derived from .fvmrc (the
# single source of truth, also used by FVM locally) via subosito/flutter-action's
# `flutter-version-file`. Bumping .fvmrc therefore updates every job at once.
name: CI

# Markdown-only changes do not need the costly Flutter checks or platform
# builds. Pull requests still start this workflow, though: `Merge gate` is a
# required status and must report for every PR. For a synchronized PR update,
# `classify` checks only the new range when the previous head has a successful
# Merge gate; otherwise it conservatively checks the whole PR diff. Pushes retain
# the path filter because they do not provide the required PR status.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    types: [opened, reopened, synchronize, edited]

# Cancel superseded in-flight runs for the same PR (or ref, for pushes) so a
# new push doesn't leave stale, redundant builds burning runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the checked-out code.
permissions:
  contents: read
  checks: read

jobs:
  # Keep the required final gate present for every PR, while selecting work from
  # either the full PR diff or a validated incremental update. --no-renames
  # makes a code-to-Markdown rename count as code-changing rather than hiding
  # the removed code path.
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      validation_changed: ${{ steps.classify.outputs.validation_changed }}
      core_tests_changed: ${{ steps.classify.outputs.core_tests_changed }}
      app_tests_changed: ${{ steps.classify.outputs.app_tests_changed }}
      builds_changed: ${{ steps.classify.outputs.builds_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != 'pull_request' ]; then
            # The retained push path filter already excludes Markdown-only pushes.
            {
              echo 'validation_changed=true'
              echo 'core_tests_changed=true'
              echo 'app_tests_changed=true'
              echo 'builds_changed=true'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo '::error::Pull request base or head SHA is unavailable.'
            exit 1
          fi
          python3 - "$BASE_SHA" "$HEAD_SHA" "$BEFORE_SHA" <<'PY'
          import json
          import os
          import subprocess
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base, head, before = sys.argv[1:]
          for label, ref in (
              ('Pull request base', base),
              ('Pull request head', head),
          ):
              resolved = subprocess.run(
                  ['git', 'rev-parse', '--verify', '--quiet', f'{ref}^{{commit}}'],
                  capture_output=True,
                  check=False,
              )
              if resolved.returncode:
                  detail = resolved.stderr.decode(errors='replace').strip()
                  print(f'::error::{label} SHA does not resolve: {detail}')
                  raise SystemExit(1)

          def prior_merge_gate_succeeded(sha):
              token = os.environ.get('GITHUB_TOKEN')
              repository = os.environ.get('GITHUB_REPOSITORY')
              if not token or not repository:
                  print(
                      '::notice::Cannot confirm the previous Merge gate; '
                      'checking the full pull request diff.'
                  )
                  return False
              request = Request(
                  f'https://api.github.com/repos/{repository}/commits/{sha}/check-runs'
                  '?check_name=Merge%20gate',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              try:
                  with urlopen(request, timeout=10) as response:
                      check_runs = json.load(response)['check_runs']
              except (HTTPError, URLError, KeyError, json.JSONDecodeError) as error:
                  print(
                      '::notice::Cannot confirm the previous Merge gate '
                      f'({error}); checking the full pull request diff.'
                  )
                  return False
              return any(
                  check_run.get('name') == 'Merge gate'
                  and check_run.get('status') == 'completed'
                  and check_run.get('conclusion') == 'success'
                  and (check_run.get('app') or {}).get('slug') == 'github-actions'
                  for check_run in check_runs
              )

          diff_range = f'{base}...{head}'
          if before and before != head:
              before_resolved = subprocess.run(
                  ['git', 'rev-parse', '--verify', '--quiet', f'{before}^{{commit}}'],
                  capture_output=True,
                  check=False,
              )
              is_ancestor = subprocess.run(
                  ['git', 'merge-base', '--is-ancestor', before, head],
                  capture_output=True,
                  check=False,
              )
              if (
                  before_resolved.returncode == 0
                  and is_ancestor.returncode == 0
                  and prior_merge_gate_succeeded(before)
              ):
                  diff_range = f'{before}..{head}'
                  print('Classifying only changes since the successful previous Merge gate.')

          result = subprocess.run(
              [
                  'git',
                  'diff',
                  '--no-renames',
                  '--name-only',
                  '-z',
                  diff_range,
              ],
              capture_output=True,
              check=False,
          )
          if result.returncode:
              detail = result.stderr.decode(errors='replace').strip()
              print(f'::error::Unable to determine pull request changes: {detail}')
              raise SystemExit(1)

          paths = tuple(path for path in result.stdout.split(b'\0') if path)
          if not paths:
              print(
                  '::error::Pull request has no changed paths; refusing to '
                  'skip validation.'
              )
              raise SystemExit(1)

          shared_runtime_paths = {
              b'.fvmrc',
              b'pubspec.yaml',
              b'pubspec.lock',
              b'analysis_options.yaml',
              b'.github/workflows/_checks.yml',
          }
          core_test_driver_paths = {
              b'tools/ci/run_core_tests_with_coverage.py',
              b'tools/ci/check_core_coverage.py',
              b'tools/ci/check_core_flutter_free.py',
          }
          validation_changed = any(not path.endswith(b'.md') for path in paths)
          core_tests_changed = validation_changed and any(
              path.startswith(b'packages/compendium_core/')
              or path in shared_runtime_paths
              or path in core_test_driver_paths
              for path in paths
          )
          app_tests_changed = validation_changed and any(
              path.startswith(b'app/')
              or path.startswith(b'packages/compendium_core/')
              or path in shared_runtime_paths
              for path in paths
          )
          builds_changed = app_tests_changed
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for name, value in (
                  ('validation_changed', validation_changed),
                  ('core_tests_changed', core_tests_changed),
                  ('app_tests_changed', app_tests_changed),
                  ('builds_changed', builds_changed),
              ):
                  output.write(f'{name}={str(value).lower()}\n')
          PY

  checks:
    # Delegate to the reusable checks workflow so the same validation/test/guard
    # definitions single-source both this PR gate and the future release
    # path (ADR-002). The event triggers, push path filter, and concurrency
    # stay here on the caller; the PR-only schema-guard and the build matrix
    # intentionally remain below (see notes on each).
    needs: classify
    if: needs.classify.outputs.validation_changed == 'true'
    uses: ./.github/workflows/_checks.yml
    with:
      run_core_tests: ${{ needs.classify.outputs.core_tests_changed == 'true' }}
      run_app_tests: ${{ needs.classify.outputs.app_tests_changed == 'true' }}

  build:
    name: Build (${{ matrix.target }})
    needs: [classify, checks]
    if: >-
      needs.classify.outputs.builds_changed == 'true' &&
      needs.checks.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
            build_args: linux --release
          - target: android
            os: ubuntu-latest
            build_args: apk --debug
          - target: macos
            os: macos-latest
            build_args: macos --release
          - target: ios
            os: macos-latest
            build_args: ios --release --no-codesign
          - target: windows
            os: windows-latest
            build_args: windows --release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle # caches ~/.gradle for the Android build
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build
        working-directory: app
        run: flutter build ${{ matrix.build_args }}

  # PR-only single-source gate: a schemaVersion bump in compendium_core's
  # database.dart must ship a migration test/fixture in the same PR. Needs full
  # history to diff against the PR base. See tools/ci/check_schema_migration.py.
  schema-guard:
    name: Schema migration gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so we can diff against the PR base
      - name: Guard schemaVersion bumps ship a migration test/fixture
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci/check_schema_migration.py "$BASE_SHA"
      # Same PR-only shape, same base ref, one more thing a bump must ship: the
      # per-version entry in the design doc that now holds the log. The
      # taxonomy and schema ledgers used to sit as doc comments on their own
      # declarations, 40.7 KiB and 19.4 KiB of history that every reader of
      # those files paid for to reach a one-line constant; moving them to
      # docs/design/ is only safe if a later bump cannot quietly append its
      # entry nowhere. See tools/ci/check_version_history.py.
      - name: Guard version bumps append their design-doc history entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci/check_version_history.py "$BASE_SHA"

  # Validate the checked-out PR state with the validator from the trusted base.
  # A PR can change its own validator, so executing the head copy would let the
  # change disable the ownership policy that is meant to constrain it.
  tracking-gate:
    name: Device Sync tracking gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate Device Sync pull-request ownership
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          validator="$(mktemp "$RUNNER_TEMP/validate-pr.XXXXXX.py")"
          trap 'rm -f "$validator"' EXIT
          git show "$BASE_SHA:tools/tracking/validate_pr.py" > "$validator"
          python3 "$validator" "$BASE_SHA" "$HEAD_SHA" "$GITHUB_EVENT_PATH" \
            --root "$GITHUB_WORKSPACE"
          python3 tools/tracking/validate.py

  # This is the sole required status for main. It runs even when a dependency
  # fails or is skipped, so a cancelled or missing heavy job cannot look green.
  merge-gate:
    name: Merge gate
    needs: [classify, checks, build, schema-guard, tracking-gate]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required job results
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          VALIDATION_CHANGED: ${{ needs.classify.outputs.validation_changed }}
          BUILDS_CHANGED: ${{ needs.classify.outputs.builds_changed }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SCHEMA_GUARD_RESULT: ${{ needs.schema-guard.result }}
          TRACKING_GATE_RESULT: ${{ needs.tracking-gate.result }}
        run: |
          set -u
          failed=0

          require_success() {
            if [ "$2" != 'success' ]; then
              echo "::error::$1 finished with '$2'; expected success."
              failed=1
            fi
          }

          require_skipped() {
            if [ "$2" != 'skipped' ]; then
              echo "::error::$1 finished with '$2'; expected skipped."
              failed=1
            fi
          }

          require_success 'Classify changes' "$CLASSIFY_RESULT"
          require_success 'Schema migration gate' "$SCHEMA_GUARD_RESULT"
          require_success 'Device Sync tracking gate' "$TRACKING_GATE_RESULT"

          case "$VALIDATION_CHANGED" in
            true)
              require_success 'Validation checks' "$CHECKS_RESULT"
              ;;
            false)
              require_skipped 'Validation checks' "$CHECKS_RESULT"
              ;;
            *)
              echo "::error::Classify changes produced invalid validation_changed output '$VALIDATION_CHANGED'."
              failed=1
              ;;
          esac

          case "$BUILDS_CHANGED" in
            true) require_success 'Platform builds' "$BUILD_RESULT" ;;
            false) require_skipped 'Platform builds' "$BUILD_RESULT" ;;
            *)
              echo "::error::Classify changes produced invalid builds_changed output '$BUILDS_CHANGED'."
              failed=1
              ;;
          esac

          exit "$failed"
