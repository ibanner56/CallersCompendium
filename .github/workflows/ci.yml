# CI: lint + test on every push/PR, plus a build matrix covering all five
# target platforms.
#
# The Flutter version is NOT hardcoded here: it is derived from .fvmrc (the
# single source of truth, also used by FVM locally) via subosito/flutter-action's
# `flutter-version-file`. Bumping .fvmrc therefore updates every job at once.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded in-flight runs for the same PR (or ref, for pushes) so a
# new push doesn't leave stale, redundant builds burning runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the checked-out code.
permissions:
  contents: read

jobs:
  checks:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Single source of truth for the Flutter version (see .fvmrc).
          flutter-version-file: .fvmrc
          channel: stable
          cache: true # caches the Flutter SDK and the pub cache
      - name: Show Flutter version (must match .fvmrc)
        run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      # ADR-001: the domain core must stay free of Flutter. Resolution/dependency
      # based guard (replaces a brittle grep that false-positived on comments):
      #   1. no Flutter package is reachable in compendium_core's resolved
      #      dependency graph (`dart pub deps --json`) — this is the authoritative
      #      check and catches a real import or transitive dependency, and
      #   2. a comment-safe source scan of lib/test/benchmark for an actual
      #      import/export directive targeting package:flutter* (comments are
      #      stripped first; the directive regex requires a full quoted URI and a
      #      trailing semicolon so it won't fire on a string-literal line).
      - name: Guard compendium_core against Flutter (ADR-001)
        run: |
          python3 <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path

          CORE = "compendium_core"
          CORE_DIR = Path("packages/compendium_core")
          FORBIDDEN = {
              "flutter", "flutter_test", "flutter_localizations",
              "flutter_web_plugins", "flutter_driver", "sky_engine",
          }
          failures = []

          # 1. Dependency-closure check over the resolved graph.
          raw = subprocess.run(
              ["dart", "pub", "deps", "--json"],
              capture_output=True, text=True, check=True,
          ).stdout
          graph = json.loads(raw)
          pkgs = {p["name"]: p for p in graph["packages"]}
          if CORE not in pkgs:
              sys.exit(f"::error::guard could not find '{CORE}' in the package graph")
          seen, stack = set(), [CORE]
          while stack:
              name = stack.pop()
              if name in seen:
                  continue
              seen.add(name)
              for dep in pkgs.get(name, {}).get("dependencies", []):
                  stack.append(dep)
          seen.discard(CORE)
          reachable = sorted(seen & FORBIDDEN)
          if reachable:
              failures.append(
                  f"transitive Flutter dependency reachable from {CORE}: "
                  + ", ".join(reachable)
              )

          # 2. Source scan of lib/test/benchmark. Comments are stripped first,
          #    and the directive regex requires a complete quoted package:flutter
          #    URI closed by the same quote and a trailing semicolon on one line,
          #    so a string literal that merely starts with `import 'package:...`
          #    won't match. The dependency-closure check above is the
          #    authoritative backstop for anything a source scan could miss.
          block = re.compile(r"/\*.*?\*/", re.DOTALL)
          line = re.compile(r"//.*")
          directive = re.compile(
              r"""^[ \t]*(?:import|export)[ \t]+(['"])package:(flutter[\w]*)/"""
              r"""[^'"\n]*\1[^;\n]*;""",
              re.MULTILINE,
          )
          scanned = 0
          for sub in ("lib", "test", "benchmark"):
              root = CORE_DIR / sub
              if not root.is_dir():
                  continue
              for dart in root.rglob("*.dart"):
                  scanned += 1
                  src = line.sub("", block.sub("", dart.read_text(encoding="utf-8")))
                  for m in directive.finditer(src):
                      failures.append(f"{dart}: imports package:{m.group(2)} (ADR-001)")

          if failures:
              for f in failures:
                  print(f"::error::{f}")
              sys.exit(1)
          print(f"OK: {CORE} is Flutter-free "
                f"(checked {len(seen)} resolved deps + {scanned} Dart files).")
          PY
      - name: Test compendium_core (with coverage)
        working-directory: packages/compendium_core
        run: |
          if [ -n "$(find test -name '*_test.dart' 2>/dev/null)" ]; then
            dart test --coverage=coverage
            dart pub global activate coverage
            dart pub global run coverage:format_coverage \
              --lcov --in=coverage --out=coverage/lcov.info \
              --report-on=lib --packages=../../.dart_tool/package_config.json
          else
            echo "No tests yet; skipping coverage."
          fi
      - name: Enforce compendium_core coverage floor
        working-directory: packages/compendium_core
        run: |
          python3 <<'PY'
          import sys
          from pathlib import Path

          FLOOR = 80.0  # conservative: current is ~86% (generated code excluded)
          lcov = Path("coverage/lcov.info")
          if not lcov.exists():
              print("No coverage report (no tests?); skipping floor.")
              sys.exit(0)

          lf = lh = 0
          skip = False
          for l in lcov.read_text().splitlines():
              if l.startswith("SF:"):
                  sf = l[3:].strip()
                  # Exclude machine-generated sources from the coverage gate.
                  skip = sf.endswith(".g.dart") or sf.endswith(".drift.dart")
              elif l.startswith("LF:") and not skip:
                  lf += int(l[3:])
              elif l.startswith("LH:") and not skip:
                  lh += int(l[3:])

          pct = (100.0 * lh / lf) if lf else 0.0
          print(f"compendium_core line coverage (generated excluded): "
                f"{pct:.2f}% ({lh}/{lf}); floor {FLOOR:.0f}%")
          if pct < FLOOR:
              print(f"::error::core coverage {pct:.2f}% is below the {FLOOR:.0f}% floor")
              sys.exit(1)
          PY
      - name: Benchmark compendium_core search (20k dances)
        working-directory: packages/compendium_core
        run: dart run benchmark/search_benchmark.dart
      - name: Test app
        working-directory: app
        run: flutter test

  build:
    name: Build (${{ matrix.target }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
            build_args: linux --release
          - target: android
            os: ubuntu-latest
            build_args: apk --debug
          - target: macos
            os: macos-latest
            build_args: macos --release
          - target: ios
            os: macos-latest
            build_args: ios --release --no-codesign
          - target: windows
            os: windows-latest
            build_args: windows --release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle # caches ~/.gradle for the Android build
      - name: Cache CocoaPods
        if: matrix.target == 'macos' || matrix.target == 'ios'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Cache only the CocoaPods spec repo / CDN download cache, which are
          # the slow parts and always exist after a pod install. The per-project
          # app/*/Pods dir is fast to regenerate and is target-specific, so it is
          # deliberately not cached (avoids "path not found" on the target that
          # doesn't build it). The repo commits no Podfile.lock, so the key is
          # derived from the committed root pubspec.lock — the authoritative
          # source for plugin (and therefore pod) versions — so the cache
          # invalidates whenever dependencies change.
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build
        working-directory: app
        run: flutter build ${{ matrix.build_args }}
