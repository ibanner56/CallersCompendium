<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Caller's Compendium — a local-first dance organizer for callers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a2e"/>
      <stop offset="1" stop-color="#20182a"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b97ff"/>
      <stop offset="1" stop-color="#e78a63"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="360" fill="#8b97ff" opacity="0.08"/>
  <circle cx="120" cy="600" r="300" fill="#e78a63" opacity="0.08"/>

  <g transform="translate(96 150)">
    <rect width="120" height="120" rx="30" fill="url(#mark)"/>
    <path d="M28 40c10-6 20-6 28 0v52c-8-6-18-6-28 0V40Z" fill="#fff" opacity="0.95"/>
    <path d="M92 40c-10-6-20-6-28 0v52c8-6 18-6 28 0V40Z" fill="#fff" opacity="0.82"/>
  </g>

  <text x="240" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="66" font-weight="700" fill="#f3f1fb">Caller's Compendium</text>
  <text x="98" y="360" font-family="Segoe UI, system-ui, sans-serif" font-size="40" font-weight="500" fill="#c3c1d4">A local-first dance organizer for callers.</text>
  <text x="98" y="424" font-family="Segoe UI, system-ui, sans-serif" font-size="32" fill="#9997ad">Catalog dances · build programs · call from a stage-ready view.</text>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#171a2e">
    <rect x="98" y="486" width="220" height="58" rx="29" fill="#8b97ff"/>
    <text x="208" y="524" text-anchor="middle">First beta live</text>
    <rect x="338" y="486" width="180" height="58" rx="29" fill="none" stroke="#4a4a63" stroke-width="2"/>
    <text x="428" y="524" text-anchor="middle" fill="#c3c1d4">Open source</text>
    <rect x="538" y="486" width="200" height="58" rx="29" fill="none" stroke="#4a4a63" stroke-width="2"/>
    <text x="638" y="524" text-anchor="middle" fill="#c3c1d4">No telemetry</text>
  </g>
</svg>
